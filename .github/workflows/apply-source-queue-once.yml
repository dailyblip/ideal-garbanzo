name: Apply source writer queue hardening

on:
  push:
    branches:
      - automation/source-writer-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/source-writer-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable durable shared writer queue
        shell: python
        run: |
          from pathlib import Path

          shared = [
              '.github/workflows/cologix-bootstrap.yml',
              '.github/workflows/coreweave-bootstrap.yml',
              '.github/workflows/databank-bootstrap.yml',
              '.github/workflows/digital-realty-bootstrap.yml',
              '.github/workflows/edgeconnex-bootstrap.yml',
              '.github/workflows/equinix-bootstrap.yml',
              '.github/workflows/flexential-bootstrap.yml',
              '.github/workflows/google-bootstrap.yml',
              '.github/workflows/major-workday-bootstrap.yml',
              '.github/workflows/novva-bootstrap.yml',
              '.github/workflows/prime-data-centers-bootstrap.yml',
              '.github/workflows/stream-data-centers-bootstrap.yml',
              '.github/workflows/switch-bootstrap.yml',
              '.github/workflows/t5-data-centers-bootstrap.yml',
          ]
          needle = "concurrency:\n  group: careers-source-writers\n  cancel-in-progress: false"
          replacement = needle + "\n  queue: max"
          for name in shared:
              path = Path(name)
              text = path.read_text()
              if 'queue: max' not in text:
                  if needle not in text:
                      raise SystemExit(f'missing expected concurrency block: {name}')
                  text = text.replace(needle, replacement, 1)
                  path.write_text(text)

          validator = Path('scripts/validate-source-workflow-isolation.mjs')
          text = validator.read_text()
          marker = "  if (scheduledPrimaryWriters.has(path)) {"
          queue_guard = (
              "  if (sharedWriterQueue.has(path) && !/queue:\\s*max\\b/.test(text)) {\n"
              "    violations.push(`${path}: shared-feed writer must use queue: max so pending employer refreshes are not replaced`);\n"
              "  }\n\n"
          )
          if 'shared-feed writer must use queue: max' not in text:
              if marker not in text:
                  raise SystemExit('validator insertion point not found')
              text = text.replace(marker, queue_guard + marker, 1)
          text = text.replace(
              '${sharedWriterQueue.size} shared-queue writers use the guarded queue,',
              '${sharedWriterQueue.size} shared-queue writers use the guarded queue with queue: max,',
              1,
          )
          validator.write_text(text)
      - name: Validate source workflow isolation
        run: node scripts/validate-source-workflow-isolation.mjs
      - name: Remove one-time patch workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-source-queue-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows scripts/validate-source-workflow-isolation.mjs
          git commit -m "Queue all shared employer refreshes"
          git push origin HEAD:automation/source-writer-queue
