name: Prepare CoreSite fallback publication state

on:
  push:
    branches:
      - automation/refresh-coresite-20260919
    paths:
      - data/coresite-verified-fallback.json
      - .github/workflows/automation-apply-coresite-pr.yml

permissions:
  contents: write

concurrency:
  group: prepare-coresite-fallback-pr
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/refresh-coresite-20260919
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate fallback state
        run: |
          node scripts/apply-coresite-verified-fallback.mjs
          node scripts/enforce-coresite-fallback-freshness.mjs
          node scripts/validate-coresite-source-integrity.mjs
          node scripts/validate-coresite-fallback.mjs
          node scripts/validate-priority-employer-sources.mjs
      - name: Commit generated publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/collector-status.json
          if git diff --cached --quiet; then
            echo "Publication state already matches the verified fallback."
            exit 0
          fi
          git commit -m "Apply verified CoreSite fallback"
          git push origin HEAD:automation/refresh-coresite-20260919
