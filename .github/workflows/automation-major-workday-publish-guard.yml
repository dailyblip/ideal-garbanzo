name: Patch major Workday classifiers

on:
  push:
    branches:
      - automation/major-workday-boundary-refresh
    paths:
      - '.github/workflows/automation-major-workday-publish-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/major-workday-boundary-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden strict five-year boundary wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          collect = 'scripts/collect-major-jobs.mjs'
          old = "  return values.filter(value => Number.isFinite(value) && value >= 0 && value <= 50);\n}\n\nfunction classify(title, description = '', employmentType = '') {"
          new = "  return values.filter(value => Number.isFinite(value) && value >= 0 && value <= 50);\n}\n\nfunction strictlyExceedsFiveYearBoundary(text = '') {\n  const normalized = normalizeExperienceNumbers(text);\n  const patterns = [\n    /\\b(?:more than|over|greater than|in excess of)\\s+(\\d{1,2})\\s+years?\\b/gi,\n    /(?:^|\\s)>\\s*(\\d{1,2})\\s+years?\\b/gi\n  ];\n  return patterns.some(pattern => [...normalized.matchAll(pattern)].some(match => Number(match[1]) >= 5));\n}\n\nfunction classify(title, description = '', employmentType = '') {"
          replace_once(collect, old, new)
          replace_once(collect, "if (years.some(year => year > 5)) return null;", "if (years.some(year => year > 5) || strictlyExceedsFiveYearBoundary(experienceText)) return null;")
          anchor = "    {\n      name: 'required experience above five years is rejected',\n      title: 'Critical Environment Engineer',\n      description: 'Basic Qualifications Seven or more years of direct experience in a technical critical environment.',\n      expectedType: null, expectedExperience: null\n    },"
          extra = "\n    {\n      name: 'strict more-than-five wording is rejected',\n      title: 'Critical Environment Engineer',\n      description: 'More than five years of direct experience in data center critical environments is required.',\n      expectedType: null, expectedExperience: null\n    },\n    {\n      name: 'strict over-five wording is rejected',\n      title: 'Critical Environment Engineer',\n      description: 'Over 5 years of direct experience in data center critical environments is required.',\n      expectedType: null, expectedExperience: null\n    },\n    {\n      name: 'strict greater-than-five wording is rejected',\n      title: 'Critical Environment Engineer',\n      description: 'Greater than five years of relevant experience in data center critical environments is required.',\n      expectedType: null, expectedExperience: null\n    },\n    {\n      name: 'strict in-excess-of-five wording is rejected',\n      title: 'Critical Environment Engineer',\n      description: 'In excess of five years of relevant experience in data center critical environments is required.',\n      expectedType: null, expectedExperience: null\n    },\n    {\n      name: 'symbolic greater-than-five wording is rejected',\n      title: 'Critical Environment Engineer',\n      description: '> 5 years of relevant experience in data center critical environments is required.',\n      expectedType: null, expectedExperience: null\n    },\n    {\n      name: 'exact five-year minimum remains eligible',\n      title: 'Critical Environment Engineer',\n      description: 'Minimum of five years of relevant experience in data center critical environments.',\n      expectedType: 'entry-level', expectedExperience: '2-5-years'\n    },\n    {\n      name: 'five-plus boundary remains eligible',\n      title: 'Critical Environment Engineer',\n      description: '5+ years of relevant experience in data center critical environments.',\n      expectedType: 'entry-level', expectedExperience: '2-5-years'\n    },"
          replace_once(collect, anchor, anchor + extra)

          recovery = 'scripts/recover-major-workday-targeted.mjs'
          old = "  return values.filter(value => Number.isFinite(value) && value >= 0 && value <= 50);\n}\n\nfunction relevant(title = '', description = '') {"
          new = "  return values.filter(value => Number.isFinite(value) && value >= 0 && value <= 50);\n}\n\nfunction strictlyExceedsFiveYearBoundary(text = '') {\n  const normalized = lower(text).replace(/\\b(?:zero|one|two|three|four|five|six|seven|eight|nine|ten)\\b/g, word => experienceNumberWords.get(word) || word);\n  const patterns = [\n    /\\b(?:more than|over|greater than|in excess of)\\s+(\\d{1,2})\\s+years?\\b/gi,\n    /(?:^|\\s)>\\s*(\\d{1,2})\\s+years?\\b/gi\n  ];\n  return patterns.some(pattern => [...normalized.matchAll(pattern)].some(match => Number(match[1]) >= 5));\n}\n\nfunction relevant(title = '', description = '') {"
          replace_once(recovery, old, new)
          replace_once(recovery, "if (years.some(year => year > 5)) return null;", "if (years.some(year => year > 5) || strictlyExceedsFiveYearBoundary(required)) return null;")
          anchor = "    {\n      name: 'six-year role rejected',\n      title: 'Data Center Technician',\n      description: 'Minimum of six years of experience in data center operations.',\n      expected: null\n    },"
          extra = "\n    {\n      name: 'more than five years is rejected',\n      title: 'Data Center Technician',\n      description: 'More than five years of experience in data center operations is required.',\n      expected: null\n    },\n    {\n      name: 'over five years is rejected',\n      title: 'Data Center Technician',\n      description: 'Over 5 years of experience in data center operations is required.',\n      expected: null\n    },\n    {\n      name: 'greater than five years is rejected',\n      title: 'Data Center Technician',\n      description: 'Greater than five years of experience in data center operations is required.',\n      expected: null\n    },\n    {\n      name: 'in excess of five years is rejected',\n      title: 'Data Center Technician',\n      description: 'In excess of five years of experience in data center operations is required.',\n      expected: null\n    },\n    {\n      name: 'symbolic greater-than five years is rejected',\n      title: 'Data Center Technician',\n      description: '> 5 years of experience in data center operations is required.',\n      expected: null\n    },\n    {\n      name: 'exact five-year role remains eligible',\n      title: 'Data Center Technician',\n      description: 'Minimum of five years of experience in data center operations.',\n      expected: '2-5-years'\n    },\n    {\n      name: 'five-plus role remains eligible at boundary',\n      title: 'Data Center Technician',\n      description: '5+ years of experience in data center operations.',\n      expected: '2-5-years'\n    },"
          replace_once(recovery, anchor, anchor + extra)
          PY
          node --check scripts/collect-major-jobs.mjs
          node --check scripts/recover-major-workday-targeted.mjs
          node scripts/collect-major-jobs.mjs --test-experience-parser
          node scripts/recover-major-workday-targeted.mjs --test
          node scripts/prune-major-workday-overfive.mjs --test
      - name: Commit classifier changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect-major-jobs.mjs scripts/recover-major-workday-targeted.mjs
          git commit -m 'Harden major Workday five-year boundary'
          git push origin HEAD:automation/major-workday-boundary-refresh
