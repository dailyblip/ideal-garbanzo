name: Normalize CoreSite publication metadata

on:
  push:
    branches:
      - automation/refresh-coresite-20260919
    paths:
      - .github/workflows/automation-normalize-coresite-pr.yml

permissions:
  contents: write

concurrency:
  group: normalize-coresite-fallback-pr
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/refresh-coresite-20260919
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize fallback and publication metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'data/coresite-verified-fallback.json';
          const fallback = JSON.parse(await readFile(path, 'utf8'));
          for (const job of fallback.jobs || []) {
            if (/^pay not listed$/i.test(String(job.pay || '').trim())) job.pay = '';
          }
          await writeFile(path, JSON.stringify(fallback, null, 2) + '\n');
          NODE
          node scripts/apply-coresite-verified-fallback.mjs
          node scripts/enforce-coresite-fallback-freshness.mjs
          node scripts/stamp-job-history.mjs --repair-only
          node scripts/sync-publication-counts.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-coresite-source-integrity.mjs
          node scripts/validate-coresite-fallback.mjs
          node scripts/validate-priority-employer-sources.mjs
      - name: Commit normalized publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coresite-verified-fallback.json data/jobs.json data/collector-status.json data/job-history.json
          if git diff --cached --quiet; then
            echo "Publication metadata already normalized."
            exit 0
          fi
          git commit -m "Normalize CoreSite publication metadata"
          git push origin HEAD:automation/refresh-coresite-20260919
