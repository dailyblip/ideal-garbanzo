name: AWS career-event coverage guard

on:
  pull_request:
    paths:
      - 'scripts/validate-aws-career-event-coverage.mjs'
      - 'data/career-events.json'
      - '.github/workflows/aws-career-event-coverage-guard.yml'
      - '.github/workflows/career-events-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate AWS workforce career-event discovery coverage
        run: node scripts/validate-aws-career-event-coverage.mjs
