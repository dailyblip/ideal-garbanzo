name: Recover AWS job requirements

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-amazon-datacenter.mjs'
      - 'scripts/recover-amazon-details.mjs'
      - 'scripts/stamp-amazon-source-verification.mjs'
      - '.github/workflows/aws-detail-recovery.yml'
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Prevent duplicate AWS refreshes without placing unrelated source runs into a
# cross-workflow queue where GitHub can replace older pending runs.
concurrency:
  group: aws-detail-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test AWS source-boundary helpers
        run: |
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/preserve-source-group.mjs --test
      - name: Preserve public-feed boundary before AWS refresh
        run: cp data/jobs.json /tmp/aws-public-before.json
      - name: Refresh official AWS data center roles
        run: |
          node --check scripts/collect-amazon-datacenter.mjs
          node scripts/collect-amazon-datacenter.mjs
      - name: Recover verified AWS requirements
        run: |
          node --check scripts/recover-amazon-details.mjs
          node scripts/recover-amazon-details.mjs
      - name: Stamp AWS source verification evidence
        run: |
          node --check scripts/stamp-amazon-source-verification.mjs
          node scripts/stamp-amazon-source-verification.mjs
      - name: Enforce AWS fallback freshness
        run: |
          node scripts/enforce-amazon-fallback-freshness.mjs --test
          node scripts/enforce-amazon-fallback-freshness.mjs
      - name: Preserve AWS collector status before shared transforms
        run: cp data/collector-status.json /tmp/aws-status-after-collect.json
      - name: Normalize recovered feed
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
      - name: Reapply AWS source boundary after shared transforms
        run: |
          node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json
          cp /tmp/aws-status-after-collect.json data/collector-status.json
          node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json --verify
          cmp -s data/collector-status.json /tmp/aws-status-after-collect.json
      - name: Refresh post-recovery tracking
        run: |
          node scripts/refresh-region-status.mjs
          node scripts/stamp-job-history.mjs --company "Amazon Web Services"
          node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json --verify
      - name: Validate recovered feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-promotions.mjs
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-mailing-list.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Publish verified AWS recovery from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/aws-public-before.json
            node --check scripts/preserve-source-group.mjs
            node --check scripts/stamp-job-history.mjs
            node --check scripts/collect-amazon-datacenter.mjs
            node scripts/collect-amazon-datacenter.mjs
            node --check scripts/recover-amazon-details.mjs
            node scripts/recover-amazon-details.mjs
            node --check scripts/stamp-amazon-source-verification.mjs
            node scripts/stamp-amazon-source-verification.mjs
            node scripts/enforce-amazon-fallback-freshness.mjs --test
            node scripts/enforce-amazon-fallback-freshness.mjs
            cp data/collector-status.json /tmp/aws-status-after-collect.json
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/normalize-display-copy.mjs
            node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json
            cp /tmp/aws-status-after-collect.json data/collector-status.json
            node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json --verify
            cmp -s data/collector-status.json /tmp/aws-status-after-collect.json
            node scripts/refresh-region-status.mjs
            node scripts/stamp-job-history.mjs --company "Amazon Web Services"
            node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json --verify
            node scripts/validate.mjs
            node scripts/validate-promotions.mjs
            node scripts/validate-job-history.mjs --allow-aging
            node scripts/validate-mailing-list.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during AWS recovery; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/amazon-jobs.json data/collector-status.json data/job-history.json
            if git diff --cached --quiet; then
              echo "No AWS recovery changes."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Recover verified AWS roles"
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during AWS publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified AWS recovery after three attempts."
          exit 1
      - name: Deploy recovered feed immediately
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f deploy_only=true
