name: Recover AWS job requirements

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover-amazon-details.mjs'
      - '.github/workflows/aws-detail-recovery.yml'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aws-detail-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover verified AWS requirements
        run: |
          node --check scripts/recover-amazon-details.mjs
          node scripts/recover-amazon-details.mjs
      - name: Normalize recovered feed
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
      - name: Run post-recovery live-link and duplicate QA
        run: node scripts/qa-site.mjs
      - name: Refresh post-QA tracking
        run: |
          node scripts/refresh-region-status.mjs
          node scripts/stamp-job-history.mjs
      - name: Validate recovered feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-promotions.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-mailing-list.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-priority-employer-sources.mjs
      - name: Commit verified AWS recovery
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/jobs.json data/amazon-jobs.json data/collector-status.json data/job-history.json data/career-events.json data/qa-report.json)" ]; then
            echo "No AWS recovery or QA changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json data/amazon-jobs.json data/collector-status.json data/job-history.json data/career-events.json data/qa-report.json
            git commit -m "Recover verified AWS roles and refresh QA"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy recovered feed immediately
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f deploy_only=true
