name: AWS source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/amazon-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'data/job-history.json'
      - 'scripts/collect-amazon-datacenter.mjs'
      - 'scripts/enforce-amazon-fallback-freshness.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-amazon-parity.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/aws-detail-recovery.yml'
      - '.github/workflows/aws-stale-fallback-watch.yml'
      - '.github/workflows/aws-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/amazon-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'data/job-history.json'
      - 'scripts/collect-amazon-datacenter.mjs'
      - 'scripts/enforce-amazon-fallback-freshness.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-amazon-parity.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/aws-detail-recovery.yml'
      - '.github/workflows/aws-stale-fallback-watch.yml'
      - '.github/workflows/aws-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AWS collector and validator syntax
        run: |
          node --check scripts/collect-amazon-datacenter.mjs
          node --check scripts/enforce-amazon-fallback-freshness.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node --check scripts/validate-job-history.mjs
          node --check scripts/validate-amazon-parity.mjs
          node --check scripts/validate-source-workflow-isolation.mjs
      - name: Guard AWS refresh cadence, source boundary and writer safety
        shell: bash
        run: |
          set -euo pipefail
          refresh='.github/workflows/aws-detail-recovery.yml'
          fallback='.github/workflows/aws-stale-fallback-watch.yml'

          grep -Fq "cron: '13 */6 * * *'" "$refresh"
          grep -Fq -- "- '.github/workflows/aws-detail-recovery.yml'" "$refresh"
          grep -Fq 'group: aws-detail-recovery' "$refresh"
          grep -Fq 'node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-public-before.json --verify' "$refresh"
          grep -Fq 'node scripts/stamp-job-history.mjs --company "Amazon Web Services"' "$refresh"
          grep -Fq 'cp /tmp/aws-status-after-collect.json data/collector-status.json' "$refresh"
          test "$(grep -Fc 'node scripts/validate-job-history.mjs --allow-aging' "$refresh")" -eq 2
          if grep -Eq 'node scripts/validate-job-history\.mjs[[:space:]]*$' "$refresh"; then
            echo "::error::AWS source refresh must allow unrelated clock-derived history aging."
            exit 1
          fi

          grep -Fq "cron: '18 */6 * * *'" "$fallback"
          grep -Fq 'cp data/jobs.json /tmp/aws-freshness-baseline.json' "$fallback"
          if [ "$(grep -Fc 'node scripts/preserve-source-group.mjs "Amazon Web Services" /tmp/aws-freshness-baseline.json --verify' "$fallback")" -lt 2 ]; then
            echo '::error::AWS fallback cleanup must verify the non-AWS public-feed boundary in both normal and race-safe paths.'
            exit 1
          fi
          if [ "$(grep -Fc 'node scripts/validate-job-history.mjs --allow-aging' "$fallback")" -lt 2 ]; then
            echo '::error::AWS fallback cleanup must tolerate unrelated job-history aging in both normal and race-safe paths.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*node scripts/validate-job-history\.mjs[[:space:]]*$' "$fallback"; then
            echo '::error::AWS fallback cleanup must not require unrelated employers to have freshly rewritten postedHours.'
            exit 1
          fi
          node scripts/validate-source-workflow-isolation.mjs
      - name: Run AWS source regressions
        run: |
          node scripts/collect-amazon-datacenter.mjs --test-experience-parser
          node scripts/enforce-amazon-fallback-freshness.mjs --test
          node scripts/preserve-source-group.mjs --test
          node scripts/validate-amazon-parity.mjs --test
      - name: Validate current AWS publication state
        run: |
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-amazon-parity.mjs
          node scripts/validate-priority-employer-sources.mjs
