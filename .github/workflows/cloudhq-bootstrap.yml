name: Refresh CloudHQ roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-cloudhq-careers.mjs
      - scripts/validate-cloudhq.mjs
      - scripts/preserve-source-group.mjs
      - scripts/stamp-job-history.mjs
      - scripts/validate-job-history.mjs
      - .github/workflows/cloudhq-bootstrap.yml
  workflow_dispatch:
  schedule:
    - cron: '53 3,15 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CloudHQ collector and source-isolation contract
        run: |
          node --check scripts/collect-cloudhq-careers.mjs
          node scripts/collect-cloudhq-careers.mjs --test-freshness
          node --check scripts/validate-cloudhq.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node --check scripts/validate-job-history.mjs
          node scripts/preserve-source-group.mjs --test
          node scripts/collect-jobs.mjs --test-preservation
      - name: Preserve shared boundaries before CloudHQ refresh
        run: |
          cp data/jobs.json /tmp/cloudhq-public-before.json
          cp data/major-jobs.json /tmp/cloudhq-major-before.json
      - name: Collect official CloudHQ Paylocity roles
        run: node scripts/collect-cloudhq-careers.mjs
      - name: Preserve CloudHQ collector status before shared transforms
        run: cp data/collector-status.json /tmp/cloudhq-status-after-collect.json
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Reapply CloudHQ source boundary after shared transforms
        run: |
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json
          cp /tmp/cloudhq-major-before.json data/major-jobs.json
          cp /tmp/cloudhq-status-after-collect.json data/collector-status.json
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
          cmp -s data/major-jobs.json /tmp/cloudhq-major-before.json
          cmp -s data/collector-status.json /tmp/cloudhq-status-after-collect.json
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate CloudHQ employer-direct snapshot
        run: node scripts/validate-cloudhq.mjs
      - name: Track CloudHQ first-seen dates
        run: node scripts/stamp-job-history.mjs --company "CloudHQ"
      - name: Verify non-CloudHQ rows remain unchanged after history stamping
        run: node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Commit verified CloudHQ roles
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/cloudhq-public-before.json
            cp data/major-jobs.json /tmp/cloudhq-major-before.json
            node --check scripts/preserve-source-group.mjs
            node --check scripts/stamp-job-history.mjs
            node --check scripts/validate-job-history.mjs
            node scripts/collect-cloudhq-careers.mjs --test-freshness
            node scripts/preserve-source-group.mjs --test
            node scripts/collect-jobs.mjs --test-preservation
            node scripts/collect-cloudhq-careers.mjs
            cp data/collector-status.json /tmp/cloudhq-status-after-collect.json
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json
            cp /tmp/cloudhq-major-before.json data/major-jobs.json
            cp /tmp/cloudhq-status-after-collect.json data/collector-status.json
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
            cmp -s data/major-jobs.json /tmp/cloudhq-major-before.json
            cmp -s data/collector-status.json /tmp/cloudhq-status-after-collect.json
            node scripts/refresh-region-status.mjs
            node scripts/validate-cloudhq.mjs
            node scripts/stamp-job-history.mjs --company "CloudHQ"
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs --allow-aging
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during CloudHQ refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/cloudhq-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No verified CloudHQ data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified CloudHQ roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during CloudHQ publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified CloudHQ data after three attempts."
          exit 1
      - name: Deploy committed CloudHQ data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
