name: CloudHQ source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/cloudhq-jobs.json'
      - 'data/jobs.json'
      - 'data/major-jobs.json'
      - 'data/job-history.json'
      - 'data/collector-status.json'
      - 'scripts/collect-cloudhq-careers.mjs'
      - 'scripts/validate-cloudhq.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/cloudhq-bootstrap.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cloudhq-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/cloudhq-jobs.json'
      - 'data/jobs.json'
      - 'data/major-jobs.json'
      - 'data/job-history.json'
      - 'data/collector-status.json'
      - 'scripts/collect-cloudhq-careers.mjs'
      - 'scripts/validate-cloudhq.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/cloudhq-bootstrap.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cloudhq-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CloudHQ collector, fallback and source-boundary helpers
        run: |
          node --check scripts/collect-cloudhq-careers.mjs
          node scripts/collect-cloudhq-careers.mjs --test-freshness
          node --check scripts/validate-cloudhq.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node --check scripts/validate-job-history.mjs
          node --check scripts/validate-source-workflow-isolation.mjs
          node scripts/preserve-source-group.mjs --test
          node scripts/collect-jobs.mjs --test-preservation
      - name: Guard CloudHQ refresh isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/cloudhq-bootstrap.yml'
          grep -Fq 'cp data/jobs.json /tmp/cloudhq-public-before.json' "$workflow"
          grep -Fq 'cp data/major-jobs.json /tmp/cloudhq-major-before.json' "$workflow"
          grep -Fq 'cp data/collector-status.json /tmp/cloudhq-status-after-collect.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify' "$workflow"
          grep -Fq 'cp /tmp/cloudhq-major-before.json data/major-jobs.json' "$workflow"
          grep -Fq 'cp /tmp/cloudhq-status-after-collect.json data/collector-status.json' "$workflow"
          grep -Fq 'node scripts/stamp-job-history.mjs --company "CloudHQ"' "$workflow"
          grep -Fq 'node scripts/validate-job-history.mjs --allow-aging' "$workflow"
          if grep -Eq '^[[:space:]]*run:[[:space:]]+node scripts/stamp-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::CloudHQ source refresh must not run unscoped job-history stamping.'
            exit 1
          fi
      - name: Preserve non-CloudHQ and shared-state boundaries
        run: |
          cp data/jobs.json /tmp/cloudhq-public-before.json
          cp data/major-jobs.json /tmp/cloudhq-major-before.json
          cp data/collector-status.json /tmp/cloudhq-status-before.json
      - name: Re-run publication transforms
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
      - name: Reapply and verify CloudHQ source boundary
        run: |
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json
          cp /tmp/cloudhq-major-before.json data/major-jobs.json
          cp /tmp/cloudhq-status-before.json data/collector-status.json
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
          cmp -s data/major-jobs.json /tmp/cloudhq-major-before.json
          cmp -s data/collector-status.json /tmp/cloudhq-status-before.json
      - name: Track only CloudHQ first-seen history
        run: node scripts/stamp-job-history.mjs --company "CloudHQ"
      - name: Verify history stamping preserved non-CloudHQ rows
        run: node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-public-before.json --verify
      - name: Validate feed history and workflow isolation
        run: |
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-source-workflow-isolation.mjs
      - name: Validate exact CloudHQ authoritative-public parity and freshness
        run: node scripts/validate-cloudhq.mjs
      - name: Validate site contract includes CloudHQ freshness gate
        run: node scripts/validate.mjs
