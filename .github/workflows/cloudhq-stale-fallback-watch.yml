name: CloudHQ stale fallback watch

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4,10,16,22 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudhq-stale-fallback-watch.yml'
      - 'scripts/enforce-cloudhq-fallback-freshness.mjs'
      - 'scripts/validate-cloudhq.mjs'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CloudHQ freshness enforcement
        run: |
          node --check scripts/enforce-cloudhq-fallback-freshness.mjs
          node --check scripts/validate-cloudhq.mjs
          node --check scripts/preserve-source-group.mjs
          node scripts/enforce-cloudhq-fallback-freshness.mjs --test
          node scripts/preserve-source-group.mjs --test
      - name: Preserve shared boundary before CloudHQ enforcement
        run: cp data/jobs.json /tmp/cloudhq-freshness-baseline.json
      - name: Enforce 96-hour CloudHQ fallback limit
        id: enforce
        shell: bash
        run: |
          set -euo pipefail
          node scripts/enforce-cloudhq-fallback-freshness.mjs
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json --verify
          if git diff --quiet -- data/jobs.json data/cloudhq-jobs.json data/collector-status.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild derived feed state after expiry
        if: steps.enforce.outputs.changed == 'true'
        run: |
          cp data/collector-status.json /tmp/cloudhq-status-after-enforce.json
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json
          cp /tmp/cloudhq-status-after-enforce.json data/collector-status.json
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json --verify
          node scripts/refresh-region-status.mjs
          node scripts/stamp-job-history.mjs --company "CloudHQ"
          node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json --verify
          node scripts/validate-cloudhq.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Publish stale CloudHQ removal from current main
        if: steps.enforce.outputs.changed == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/cloudhq-freshness-baseline.json
            node scripts/enforce-cloudhq-fallback-freshness.mjs
            if git diff --quiet -- data/jobs.json data/cloudhq-jobs.json data/collector-status.json; then
              echo 'No stale CloudHQ state remains on latest main.'
              return 0
            fi
            cp data/collector-status.json /tmp/cloudhq-status-after-enforce.json
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json
            cp /tmp/cloudhq-status-after-enforce.json data/collector-status.json
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json --verify
            node scripts/refresh-region-status.mjs
            node scripts/stamp-job-history.mjs --company "CloudHQ"
            node scripts/preserve-source-group.mjs "CloudHQ" /tmp/cloudhq-freshness-baseline.json --verify
            node scripts/validate-cloudhq.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs --allow-aging
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main moved during CloudHQ fallback enforcement; rebuilding from latest main.'
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/cloudhq-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo 'No stale CloudHQ state remains to publish.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Remove expired CloudHQ fallback roles'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main moved during CloudHQ fallback publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo '::error::Could not publish CloudHQ fallback expiry after three fresh-main rebuilds.'
          exit 1
      - name: Deploy committed stale-role removal
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
