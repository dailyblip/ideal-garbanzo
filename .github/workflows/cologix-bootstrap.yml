name: Refresh Cologix employer-direct roles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-cologix.mjs'
      - 'scripts/validate-cologix.mjs'
      - 'scripts/validate-cologix-publication-state.mjs'
      - 'scripts/enforce-cologix-fallback-freshness.mjs'
      - '.github/workflows/cologix-bootstrap.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 1,7,13,19 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector and preservation contract
        run: |
          node --check scripts/collect-cologix.mjs
          node --check scripts/validate-cologix.mjs
          node --check scripts/validate-cologix-publication-state.mjs
          node --check scripts/enforce-cologix-fallback-freshness.mjs
          node scripts/collect-cologix.mjs --test-classifier
          node scripts/validate-cologix.mjs --test
          node scripts/validate-cologix-publication-state.mjs --test
          node scripts/enforce-cologix-fallback-freshness.mjs --test
          node scripts/collect-jobs.mjs --test-preservation
      - name: Enforce Cologix snapshot freshness before collection
        run: node scripts/enforce-cologix-fallback-freshness.mjs
      - name: Collect official Cologix Lever roles
        run: node scripts/collect-cologix.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Track first-seen dates
        run: node scripts/stamp-job-history.mjs
      - name: Validate Cologix publication state
        run: node scripts/validate-cologix-publication-state.mjs
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Publish verified Cologix roles from current main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-cologix.mjs --test-classifier
            node scripts/validate-cologix.mjs --test
            node scripts/validate-cologix-publication-state.mjs --test
            node scripts/enforce-cologix-fallback-freshness.mjs --test
            node scripts/collect-jobs.mjs --test-preservation
            node scripts/enforce-cologix-fallback-freshness.mjs
            node scripts/collect-cologix.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/refresh-region-status.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate-cologix-publication-state.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main moved during Cologix refresh; rebuilding from latest main.'
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/cologix-jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo 'No verified Cologix data changes.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m 'Refresh verified Cologix roles'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Cologix publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo '::error::Could not publish verified Cologix data after three fresh-main rebuilds.'
          exit 1
      - name: Deploy committed Cologix data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
