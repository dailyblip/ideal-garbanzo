name: Cologix source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/cologix-jobs.json'
      - 'data/jobs.json'
      - 'data/job-history.json'
      - 'data/collector-status.json'
      - 'scripts/collect-cologix.mjs'
      - 'scripts/validate-cologix.mjs'
      - 'scripts/validate-cologix-publication-state.mjs'
      - 'scripts/enforce-cologix-fallback-freshness.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - '.github/workflows/cologix-bootstrap.yml'
      - '.github/workflows/cologix-stale-fallback-watch.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cologix-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/cologix-jobs.json'
      - 'data/jobs.json'
      - 'data/job-history.json'
      - 'data/collector-status.json'
      - 'scripts/collect-cologix.mjs'
      - 'scripts/validate-cologix.mjs'
      - 'scripts/validate-cologix-publication-state.mjs'
      - 'scripts/enforce-cologix-fallback-freshness.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - '.github/workflows/cologix-bootstrap.yml'
      - '.github/workflows/cologix-stale-fallback-watch.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cologix-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cologix collector and integrity validators
        run: |
          node --check scripts/collect-cologix.mjs
          node --check scripts/validate-cologix.mjs
          node --check scripts/validate-cologix-publication-state.mjs
          node --check scripts/enforce-cologix-fallback-freshness.mjs
      - name: Run Cologix fail-closed regression tests
        run: |
          node scripts/collect-cologix.mjs --test-classifier
          node scripts/validate-cologix.mjs --test
          node scripts/validate-cologix-publication-state.mjs --test
          node scripts/enforce-cologix-fallback-freshness.mjs --test
      - name: Test Cologix source-boundary helpers
        run: |
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/preserve-source-group.mjs --test
      - name: Guard Cologix refresh isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/cologix-bootstrap.yml'
          grep -Fq 'cp data/jobs.json /tmp/cologix-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Cologix" /tmp/cologix-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Cologix" /tmp/cologix-public-before.json --verify' "$workflow"
          grep -Fq 'node scripts/stamp-job-history.mjs --company "Cologix"' "$workflow"
          grep -Fq 'node scripts/validate-job-history.mjs --allow-aging' "$workflow"
          if grep -Eq '^[[:space:]]*run:[[:space:]]+node scripts/stamp-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::Cologix source refresh must not run unscoped job-history stamping.'
            exit 1
          fi
      - name: Enforce Cologix fallback freshness
        run: node scripts/enforce-cologix-fallback-freshness.mjs
      - name: Re-run publication transforms
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
      - name: Validate Cologix publication state
        run: node scripts/validate-cologix-publication-state.mjs
