name: Bootstrap Compass Datacenters roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-compass-datacenters.mjs
      - scripts/persist-compass-status.mjs
      - scripts/validate-compass-datacenters.mjs
      - .github/workflows/compass-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: compass-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector syntax
        run: |
          node --check scripts/collect-compass-datacenters.mjs
          node --check scripts/persist-compass-status.mjs
          node --check scripts/validate-compass-datacenters.mjs
      - name: Collect official Compass Datacenters roles
        run: node scripts/collect-compass-datacenters.mjs
      - name: Persist Compass source health
        run: node scripts/persist-compass-status.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize job locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Run live QA
        run: node scripts/qa-site.mjs
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate Compass source health
        run: node scripts/validate-compass-datacenters.mjs
      - name: Track first-seen dates
        run: node scripts/stamp-job-history.mjs
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
      - name: Commit verified Compass Datacenters roles
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-compass-datacenters.mjs
            node scripts/persist-compass-status.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/qa-site.mjs
            node scripts/refresh-region-status.mjs
            node scripts/validate-compass-datacenters.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
          }

          # Shared feed data can move while this source is being verified. Always
          # rebuild from the newest main snapshot instead of rebasing two generated
          # jobs.json versions, which can conflict or discard another source update.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Compass refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/job-history.json data/collector-status.json data/compass-status.json data/qa-report.json
            if git diff --cached --quiet; then
              echo "No verified Compass Datacenters data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Compass Datacenters roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Compass publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Compass Datacenters data after three attempts."
          exit 1
      - name: Deploy committed Compass data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
