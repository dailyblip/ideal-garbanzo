name: Compass source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/compass-jobs.json'
      - 'data/compass-status.json'
      - 'scripts/collect-compass-datacenters.mjs'
      - 'scripts/persist-compass-status.mjs'
      - 'scripts/validate-compass-datacenters.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - '.github/workflows/compass-bootstrap.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/compass-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/compass-jobs.json'
      - 'data/compass-status.json'
      - 'scripts/collect-compass-datacenters.mjs'
      - 'scripts/persist-compass-status.mjs'
      - 'scripts/validate-compass-datacenters.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/normalize-display-copy.mjs'
      - '.github/workflows/compass-bootstrap.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/compass-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Compass source regressions
        run: |
          node --check scripts/collect-compass-datacenters.mjs
          node --check scripts/persist-compass-status.mjs
          node --check scripts/validate-compass-datacenters.mjs
          node scripts/collect-compass-datacenters.mjs --test-classifier
          node scripts/persist-compass-status.mjs --test-freshness
          node scripts/validate-compass-datacenters.mjs --test
      - name: Re-run publication transforms
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
      - name: Validate Compass authoritative-public parity
        run: node scripts/validate-compass-datacenters.mjs
