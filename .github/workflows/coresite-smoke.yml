name: CoreSite collector smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-coresite.mjs'
      - 'scripts/apply-coresite-verified-fallback.mjs'
      - 'data/coresite-verified-fallback.json'
      - '.github/workflows/coresite-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CoreSite official collector
        run: node scripts/collect-coresite.mjs
      - name: Apply verified fallback if the official host blocks GitHub
        run: node scripts/apply-coresite-verified-fallback.mjs
      - name: Normalize and validate fallback feed
        run: |
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
      - name: Require current verified CoreSite coverage
        run: |
          node - <<'NODE'
          const jobs = require('./data/jobs.json').filter(job => job.company === 'CoreSite');
          const status = require('./data/collector-status.json').coreSite;
          console.log(JSON.stringify({jobs: jobs.map(({id,title,location,experience}) => ({id,title,location,experience})), status}, null, 2));
          if (jobs.length < 5) process.exit(1);
          if (!status?.sourceHealthy && !status?.verifiedFallback?.active) process.exit(1);
          if (jobs.some(job => !job.region)) process.exit(1);
          NODE
