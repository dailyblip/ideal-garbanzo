name: Refresh CoreWeave data-center roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-coreweave-careers.mjs
      - scripts/enforce-coreweave-fallback-freshness.mjs
      - scripts/validate-coreweave.mjs
      - data/coreweave-source-evidence.json
      - .github/workflows/coreweave-bootstrap.yml
      - .github/workflows/coreweave-source-integrity-guard.yml
  workflow_dispatch:
  schedule:
    - cron: '21 */12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CoreWeave collector and source guard
        run: |
          node --check scripts/collect-coreweave-careers.mjs
          node scripts/collect-coreweave-careers.mjs --test-experience-parser
          node --check scripts/enforce-coreweave-fallback-freshness.mjs
          node scripts/enforce-coreweave-fallback-freshness.mjs --test
          node --check scripts/validate-coreweave.mjs
          node scripts/validate-coreweave.mjs --test
      - name: Collect official CoreWeave careers roles
        run: node scripts/collect-coreweave-careers.mjs
      - name: Enforce verified fallback freshness
        run: node scripts/enforce-coreweave-fallback-freshness.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Run live QA
        run: node scripts/qa-site.mjs
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate CoreWeave employer-direct snapshot
        run: |
          node scripts/enforce-coreweave-fallback-freshness.mjs --check
          node scripts/validate-coreweave.mjs
      - name: Track first-seen dates
        run: node scripts/stamp-job-history.mjs
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Publish verified CoreWeave roles from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-coreweave-careers.mjs
            node scripts/enforce-coreweave-fallback-freshness.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/qa-site.mjs
            node scripts/refresh-region-status.mjs
            node scripts/enforce-coreweave-fallback-freshness.mjs --check
            node scripts/validate-coreweave.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during CoreWeave collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/coreweave-jobs.json data/coreweave-source-evidence.json data/major-jobs.json data/job-history.json data/collector-status.json data/career-events.json data/qa-report.json
            if git diff --cached --quiet; then
              echo "No verified CoreWeave data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified CoreWeave data-center roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during CoreWeave publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified CoreWeave roles after three attempts."
          exit 1
      - name: Deploy committed CoreWeave data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
