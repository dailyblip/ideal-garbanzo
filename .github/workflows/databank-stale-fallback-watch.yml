name: DataBank stale fallback watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,11,17,23 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate DataBank freshness enforcement
        run: |
          node --check scripts/enforce-databank-fallback-freshness.mjs
          node --check scripts/validate-databank-publication-state.mjs
          node scripts/enforce-databank-fallback-freshness.mjs --test
          node scripts/validate-databank-publication-state.mjs --test
      - name: Enforce 96-hour DataBank fallback limit
        id: enforce
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain -- data/jobs.json data/databank-jobs.json data/collector-status.json)"
          node scripts/enforce-databank-fallback-freshness.mjs
          after="$(git status --porcelain -- data/jobs.json data/databank-jobs.json data/collector-status.json)"
          if [ "$before" = "$after" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild derived feed state after expiry
        if: steps.enforce.outputs.changed == 'true'
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/qa-site.mjs
          node scripts/refresh-region-status.mjs
          node scripts/stamp-job-history.mjs
          node scripts/validate-databank-publication-state.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish stale DataBank removal from current main
        if: steps.enforce.outputs.changed == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/enforce-databank-fallback-freshness.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/qa-site.mjs
            node scripts/refresh-region-status.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate-databank-publication-state.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main moved during DataBank fallback enforcement; rebuilding from latest main.'
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/databank-jobs.json data/job-history.json data/collector-status.json data/career-events.json data/qa-report.json
            if git diff --cached --quiet; then
              echo 'No stale DataBank state remains to publish.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Remove expired DataBank fallback roles'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main moved during DataBank fallback publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo '::error::Could not publish DataBank fallback expiry after three fresh-main rebuilds.'
          exit 1
      - name: Deploy committed stale-role removal
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
