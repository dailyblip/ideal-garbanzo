name: Bootstrap Digital Realty roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-digital-realty.mjs
      - scripts/validate-digital-realty.mjs
      - scripts/enforce-digital-realty-fallback-freshness.mjs
      - scripts/preserve-source-group.mjs
      - .github/workflows/digital-realty-bootstrap.yml
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Digital Realty collector, freshness and source-isolation policy
        run: |
          node --check scripts/collect-digital-realty.mjs
          node --check scripts/validate-digital-realty.mjs
          node --check scripts/enforce-digital-realty-fallback-freshness.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/preserve-source-group.mjs --test
          node scripts/enforce-digital-realty-fallback-freshness.mjs --test
          node scripts/validate-digital-realty.mjs --test-freshness
      - name: Preserve public-feed boundary before Digital Realty refresh
        run: cp data/jobs.json /tmp/digital-realty-public-before.json
      - name: Collect official Digital Realty Oracle Recruiting Cloud roles
        run: node scripts/collect-digital-realty.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Reapply Digital Realty source boundary after shared transforms
        run: |
          node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json
          node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json --verify
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate Digital Realty employer-direct snapshot
        run: node scripts/validate-digital-realty.mjs
      - name: Track Digital Realty first-seen dates
        run: node scripts/stamp-job-history.mjs --company "Digital Realty"
      - name: Verify non-Digital Realty rows remain unchanged after history stamping
        run: node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json --verify
      - name: Validate updated feed and priority-source contract
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Publish verified Digital Realty roles from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/digital-realty-public-before.json
            node scripts/collect-digital-realty.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json
            node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json --verify
            node scripts/refresh-region-status.mjs
            node scripts/validate-digital-realty.mjs --test-freshness
            node scripts/validate-digital-realty.mjs
            node scripts/stamp-job-history.mjs --company "Digital Realty"
            node scripts/preserve-source-group.mjs "Digital Realty" /tmp/digital-realty-public-before.json --verify
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Digital Realty collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/digital-realty-jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No verified Digital Realty data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Digital Realty roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Digital Realty publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Digital Realty roles after three attempts."
          exit 1
      - name: Deploy committed Digital Realty data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
