name: Early-career stale job pruning

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune-closed-early-career.mjs'
      - '.github/workflows/early-career-stale-prune.yml'
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: early-career-stale-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard stale-link policy
        run: node scripts/prune-closed-early-career.mjs --test

      - name: Recheck employer-direct early-career URLs
        id: prune
        run: |
          node scripts/prune-closed-early-career.mjs
          if git diff --quiet -- data/jobs.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No definitively closed early-career roles found.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize and validate pruned feed
        if: steps.prune.outputs.changed == 'true'
        run: |
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
          node scripts/stamp-job-history.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs

      - name: Commit definitively closed role removals
        if: steps.prune.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/job-history.json data/collector-status.json
          if git diff --cached --quiet; then
            echo 'No pruned data changes to commit.'
            exit 0
          fi
          git commit -m 'Prune closed early-career job links'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Deploy pruned feed
        if: steps.prune.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
