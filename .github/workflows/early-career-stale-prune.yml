name: Early-career stale job pruning

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prune-closed-early-career.mjs'
      - '.github/workflows/early-career-stale-prune.yml'
  schedule:
    - cron: '16 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: early-career-stale-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard stale-link policy
        run: node scripts/prune-closed-early-career.mjs --test

      - name: Recheck employer-direct early-career URLs
        id: prune
        run: |
          node scripts/prune-closed-early-career.mjs
          if git diff --quiet -- data/jobs.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No definitively closed early-career roles found.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize and validate pruned feed
        if: steps.prune.outputs.changed == 'true'
        run: |
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
          node scripts/stamp-job-history.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs

      - name: Commit definitively closed role removals safely
        id: publish
        if: steps.prune.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/prune-closed-early-career.mjs

            if git diff --quiet -- data/jobs.json; then
              git restore --source=HEAD -- data/collector-status.json
              return 0
            fi

            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/normalize-display-copy.mjs
            node scripts/stamp-job-history.mjs
            node scripts/refresh-region-status.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
          }

          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "$current_main" ]; then
            echo 'main moved during stale-prune; rebuilding against latest main'
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            if git diff --quiet -- data/jobs.json; then
              echo 'pushed=false' >> "$GITHUB_OUTPUT"
              echo 'Another refresh already removed the confirmed closed roles.'
              exit 0
            fi

            git add data/jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo 'pushed=false' >> "$GITHUB_OUTPUT"
              echo 'No pruned data changes to commit.'
              exit 0
            fi

            git commit -m 'Prune closed early-career job links'
            if git push origin HEAD:main; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt $attempt lost a feed-writer race; rebuilding on latest main"
            rebuild_from_latest_main
          done

          echo '::error::Unable to publish stale-prune after 3 fresh-main retries'
          exit 1

      - name: Deploy pruned feed
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
