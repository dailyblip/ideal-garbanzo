name: Bootstrap Equinix Careers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-equinix-v2.mjs'
      - 'scripts/collect-equinix-early.mjs'
      - 'scripts/recover-equinix-rendered-details.mjs'
      - 'scripts/apply-equinix-verified-fallback.mjs'
      - 'scripts/promote-equinix-direct-clicks.mjs'
      - 'scripts/enforce-equinix-verified-evidence.mjs'
      - 'scripts/enforce-equinix-fallback-freshness.mjs'
      - '.github/workflows/equinix-bootstrap.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions:
  actions: write
  contents: write

# Scheduled feed writers share this queue, but push triggers stay source-specific
# so a common pipeline edit cannot flood the single pending slot.
concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official Equinix careers roles
        run: node scripts/collect-equinix-v2.mjs
      - name: Add Equinix US early-career roles
        run: node scripts/collect-equinix-early.mjs
      - name: Recover requirements from official Equinix locale detail pages
        run: node scripts/recover-equinix-rendered-details.mjs
      - name: Restore source-verified Equinix roles when rendered requirements are unavailable
        run: node scripts/apply-equinix-verified-fallback.mjs
      - name: Test Equinix direct-click promotion
        run: node scripts/promote-equinix-direct-clicks.mjs --test
      - name: Prefer verified Equinix direct job links
        run: node scripts/promote-equinix-direct-clicks.mjs
      - name: Enforce exact per-role Equinix fallback evidence
        run: |
          node scripts/enforce-equinix-verified-evidence.mjs --test
          node scripts/enforce-equinix-verified-evidence.mjs
      - name: Enforce Equinix broad-source fallback freshness
        run: |
          node scripts/enforce-equinix-fallback-freshness.mjs --test
          node scripts/enforce-equinix-fallback-freshness.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate refreshed feed and employer-direct source
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish Equinix data from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-equinix-v2.mjs
            node scripts/collect-equinix-early.mjs
            node scripts/recover-equinix-rendered-details.mjs
            node scripts/apply-equinix-verified-fallback.mjs
            node scripts/promote-equinix-direct-clicks.mjs --test
            node scripts/promote-equinix-direct-clicks.mjs
            node scripts/enforce-equinix-verified-evidence.mjs --test
            node scripts/enforce-equinix-verified-evidence.mjs
            node scripts/enforce-equinix-fallback-freshness.mjs --test
            node scripts/enforce-equinix-fallback-freshness.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Equinix collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Equinix Careers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Bootstrap verified Equinix Careers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Equinix publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Equinix Careers roles after three attempts."
          exit 1
      - name: Deploy committed Equinix data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
