name: Equinix stale fallback watchdog

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-equinix-fallback-freshness.mjs'
      - 'scripts/collect-equinix-v2.mjs'
      - '.github/workflows/equinix-stale-fallback-watch.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: equinix-stale-fallback-watch
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Equinix fallback age policy
        run: node scripts/enforce-equinix-fallback-freshness.mjs --test
      - name: Enforce Equinix broad-source fallback freshness
        run: node scripts/enforce-equinix-fallback-freshness.mjs
      - name: Validate feed and priority employer sources
        run: |
          node scripts/validate.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Commit stale-fallback state when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain --untracked-files=no -- data/jobs.json data/collector-status.json)" ]; then
            echo "Equinix fallback state is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- data/jobs.json data/collector-status.json
          git commit -m "Enforce Equinix fallback freshness"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Could not rebase Equinix freshness state onto latest main."
            exit 1
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy Equinix freshness change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
