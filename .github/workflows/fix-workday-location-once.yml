name: One-shot Workday collector repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-workday-location-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Workday location selection and one-time baseline migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          collector = Path('scripts/collect-major-jobs.mjs')
          text = collector.read_text()
          helper_anchor = "function relativePostedAt(label = '') {"
          helper = """function workdayLocationLabel(value) {
            if (typeof value === 'string') return clean(value);
            if (!value || typeof value !== 'object') return '';
            return clean(value.title || value.name || value.displayName || value.location?.title || value.location?.name || (typeof value.location === 'string' ? value.location : ''));
          }

          function selectWorkdayLocation(row = {}, info = {}) {
            const primary = workdayLocationLabel(info.location);
            const additional = (Array.isArray(info.additionalLocations) ? info.additionalLocations : [])
              .map(workdayLocationLabel)
              .filter(Boolean)
              .filter(value => value !== primary);
            if (primary && !/^\\d+\\s+locations?$/i.test(primary)) {
              return additional.length ? `${primary} + ${additional.length} more location${additional.length === 1 ? '' : 's'}` : primary;
            }
            if (additional.length) {
              const first = additional[0];
              const remaining = additional.length - 1;
              return remaining ? `${first} + ${remaining} more location${remaining === 1 ? '' : 's'}` : first;
            }
            return clean(row.locationsText || primary || 'Location not listed');
          }

          """
          if 'function selectWorkdayLocation(' not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('Workday helper anchor drifted')
              text = text.replace(helper_anchor, helper + helper_anchor)
          old_location = "        const location = clean(row.locationsText || info.location || 'Location not listed');"
          new_location = "        const location = selectWorkdayLocation(row, info);"
          if old_location in text:
              text = text.replace(old_location, new_location, 1)
          elif new_location not in text:
              raise SystemExit('Workday location assignment drifted')
          collector.write_text(text)

          guard = Path('scripts/validate-refresh-health.mjs')
          text = guard.read_text()
          if 'firstDetailHydratedBaseline' not in text:
              pattern = re.compile(
                  r"(?P<indent>\s*)if \(previousCount >= 15 && currentCount < Math\.ceil\(previousCount \* 0\.25\)\) \{\n"
                  r"(?P=indent)  problems\.push\(`\$\{company\} dropped from \$\{previousCount\} to \$\{currentCount\} qualifying jobs in one refresh\.`\);\n"
                  r"(?P=indent)\}"
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('Refresh-health major-employer guard drifted')
              indent = match.group('indent')
              replacement = f"""{indent}if (previousCount >= 15 && currentCount < Math.ceil(previousCount * 0.25)) {{
          {indent}  const currentDiagnostic = status?.majorSources?.employerDiagnostics?.[company];
          {indent}  const previousHadDiagnostics = Boolean(previousStatus?.majorSources?.employerDiagnostics?.[company]);
          {indent}  const firstDetailHydratedBaseline = !previousHadDiagnostics &&
          {indent}    currentDiagnostic?.sourceHealthy === true &&
          {indent}    currentDiagnostic?.listingComplete === true &&
          {indent}    currentDiagnostic?.usedPreviousSnapshot === false;
          {indent}  if (firstDetailHydratedBaseline) {{
          {indent}    warnings.push(`${{company}} re-baselined from ${{previousCount}} to ${{currentCount}} after the first complete detail-hydrated Workday scan; future drops remain guarded.`);
          {indent}  }} else {{
          {indent}    problems.push(`${{company}} dropped from ${{previousCount}} to ${{currentCount}} qualifying jobs in one refresh.`);
          {indent}  }}
          {indent}}}"""
              text = pattern.sub(replacement, text, count=1)
              guard.write_text(text)
          PY

      - name: Validate patched scripts
        run: |
          node --check scripts/collect-major-jobs.mjs
          node --check scripts/validate-refresh-health.mjs
          node scripts/collect-major-jobs.mjs --test-experience-parser

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect-major-jobs.mjs scripts/validate-refresh-health.mjs
          if git diff --cached --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git commit -m 'Repair Workday locations and refresh baseline guard'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
