name: One-shot Workday collector repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-workday-location-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Workday detail-location repair
        run: node scripts/patch-workday-location-once.mjs
      - name: Validate collector
        run: |
          node --check scripts/collect-major-jobs.mjs
          node scripts/collect-major-jobs.mjs --test-experience-parser
      - name: Commit collector repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect-major-jobs.mjs
          if git diff --cached --quiet; then
            echo 'Workday location repair already applied.'
            exit 0
          fi
          git commit -m 'Use Workday detail locations for regional filtering'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
