name: Generic ATS direct refresh and stale fallback watchdog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-generic-fallback-freshness.mjs'
      - 'scripts/restore-generic-dedicated-overlap.mjs'
      - 'scripts/collect-jobs.mjs'
      - 'scripts/collect-jobs-core.mjs'
      - '.github/workflows/generic-ats-stale-fallback-watch.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: generic-ats-stale-fallback-watch
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generic ATS freshness and source isolation
        run: |
          node scripts/enforce-generic-fallback-freshness.mjs --test
          node scripts/restore-generic-dedicated-overlap.mjs --test
      - name: Snapshot published feed before generic ATS refresh
        run: cp data/jobs.json /tmp/jobs-before-generic.json
      - name: Refresh shared employer-direct ATS sources
        run: node scripts/collect-jobs.mjs
      - name: Restore stronger dedicated-source results
        run: node scripts/restore-generic-dedicated-overlap.mjs /tmp/jobs-before-generic.json
      - name: Enforce generic ATS fallback freshness
        run: node scripts/enforce-generic-fallback-freshness.mjs
      - name: Validate generic ATS freshness state
        run: node scripts/enforce-generic-fallback-freshness.mjs --validate
      - name: Enforce publication-safe feed
        run: |
          # Shared ATS boards can change titles or taxonomies between refreshes.
          # Apply the same deterministic publication backstops used by the global
          # guard before validation so obvious senior/non-mission drift is removed
          # rather than either reaching main or permanently wedging this refresh.
          node scripts/filter-mission-fit.mjs
          node scripts/prune-unsupported-classification.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/prune-unresolved-geography.mjs
          node scripts/sync-publication-counts.mjs
          node scripts/dedupe-normalized-jobs.mjs
          # Generic ATS refreshes create and remove public jobs outside the daily
          # full build. Stamp history here too so every published role has stable
          # first-seen/last-changed metadata before downstream email or SEO use.
          node scripts/stamp-job-history.mjs
      - name: Validate publication contracts
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-t5-data-centers.mjs
          node scripts/validate-flexential.mjs
          node scripts/validate-coreweave.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-direct-role-links.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish refreshed generic ATS state from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/jobs-before-generic.json
            node scripts/collect-jobs.mjs
            node scripts/restore-generic-dedicated-overlap.mjs /tmp/jobs-before-generic.json
            node scripts/enforce-generic-fallback-freshness.mjs
            node scripts/enforce-generic-fallback-freshness.mjs --validate
            node scripts/filter-mission-fit.mjs
            node scripts/prune-unsupported-classification.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/prune-unresolved-geography.mjs
            node scripts/sync-publication-counts.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            # Re-run the complete publication validator after any fresh-main
            # rebuild. A push race must never bypass the cleanup or validation.
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-t5-data-centers.mjs
            node scripts/validate-flexential.mjs
            node scripts/validate-coreweave.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-direct-role-links.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during generic ATS refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            feed_changed=false
            if ! git diff --quiet -- data/jobs.json data/major-jobs.json; then
              feed_changed=true
            fi

            git add -u -- data/jobs.json data/major-jobs.json data/collector-status.json data/job-history.json
            if git diff --cached --quiet; then
              echo "Generic ATS source and publication state is unchanged."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "feed_changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh generic ATS jobs and enforce publication safety"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "feed_changed=${feed_changed}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during generic ATS publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish generic ATS refresh state after three fresh-main rebuilds."
          exit 1
      - name: Deploy verified generic ATS feed change
        if: steps.publish.outputs.changed == 'true' && steps.publish.outputs.feed_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
