name: Bootstrap Google Careers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-google-careers.mjs'
      - 'scripts/collect-google-careers-fresh.mjs'
      - 'scripts/validate-google-snapshot.mjs'
      - '.github/workflows/google-bootstrap.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  actions: write
  contents: write

# Scheduled feed writers share this queue, but push triggers stay source-specific
# so a common pipeline edit cannot flood the single pending slot.
concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Google fallback freshness policy
        run: node scripts/collect-google-careers-fresh.mjs --self-test
      - name: Test Google snapshot identity policy
        run: node scripts/validate-google-snapshot.mjs --test
      - name: Collect official Google Careers roles
        run: node scripts/collect-google-careers-fresh.mjs
      - name: Confirm collector merged the Google snapshot
        run: |
          node - <<'NODE'
          const jobs = require('./data/jobs.json');
          const snapshot = require('./data/google-jobs.json');
          const status = require('./data/collector-status.json');
          const publicGoogle = jobs.filter(job => job.company === 'Google');
          if (publicGoogle.length !== snapshot.length) {
            throw new Error(`Google collector merge mismatch: ${snapshot.length} snapshot vs ${publicGoogle.length} public immediately after collection`);
          }
          if (status.googleCareers?.fallbackExpired && (snapshot.length || publicGoogle.length)) {
            throw new Error(`Expired Google fallback still publishes ${snapshot.length} snapshot / ${publicGoogle.length} public role(s)`);
          }
          console.log(`Google collector merge: ${publicGoogle.length}/${snapshot.length} roles present; fallbackExpired=${Boolean(status.googleCareers?.fallbackExpired)}.`);
          NODE
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate refreshed feed and Google parity
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-google-freshness.mjs
          node scripts/validate-google-snapshot.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish Google snapshot from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          verify_google_merge() {
            node - <<'NODE'
          const jobs = require('./data/jobs.json');
          const snapshot = require('./data/google-jobs.json');
          const status = require('./data/collector-status.json');
          const publicGoogle = jobs.filter(job => job.company === 'Google');
          if (publicGoogle.length !== snapshot.length) {
            throw new Error(`Google collector merge mismatch: ${snapshot.length} snapshot vs ${publicGoogle.length} public immediately after collection`);
          }
          if (status.googleCareers?.fallbackExpired && (snapshot.length || publicGoogle.length)) {
            throw new Error(`Expired Google fallback still publishes ${snapshot.length} snapshot / ${publicGoogle.length} public role(s)`);
          }
          console.log(`Google collector merge: ${publicGoogle.length}/${snapshot.length} roles present; fallbackExpired=${Boolean(status.googleCareers?.fallbackExpired)}.`);
          NODE
          }

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-google-careers-fresh.mjs --self-test
            node scripts/validate-google-snapshot.mjs --test
            node scripts/collect-google-careers-fresh.mjs
            verify_google_merge
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-google-freshness.mjs
            node scripts/validate-google-snapshot.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Google collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            # filter-mission-fit.mjs may also prune the shared major Workday snapshot.
            git add data/google-jobs.json data/jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Google Careers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Bootstrap verified Google Careers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Google publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Google Careers roles after three attempts."
          exit 1
      - name: Deploy committed Google data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
