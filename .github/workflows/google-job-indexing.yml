name: Notify Google about JobPosting changes

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
  schedule:
    # Shortly after Google's Indexing API daily quota resets at midnight Pacific.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-job-indexing
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate indexing queue
        env:
          GOOGLE_INDEXING_DRY_RUN: '1'
          GOOGLE_INDEXING_MAX_PUBLISH: '170'
        run: |
          node --check scripts/notify-google-indexing.mjs
          node scripts/notify-google-indexing.mjs
      - name: Check Google Indexing API credentials
        id: credentials
        shell: bash
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google JobPosting Indexing API is wired but inactive until GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is configured."
          fi
      - name: Notify Google about verified job changes
        if: steps.credentials.outputs.configured == 'true'
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GOOGLE_INDEXING_MAX_PUBLISH: '170'
          GOOGLE_INDEXING_MIN_INTERVAL_MS: '225'
        run: node scripts/notify-google-indexing.mjs
      - name: Persist successful notification state
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/google-indexing-state.json; then
            echo "No Google indexing notification state changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google-indexing-state.json
          git commit -m "Record Google JobPosting indexing notifications"
          git pull --rebase origin main
          git push origin HEAD:main
