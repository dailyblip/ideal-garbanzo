name: Google source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/google-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/collect-google-careers.mjs'
      - 'scripts/collect-google-careers-fresh.mjs'
      - 'scripts/enforce-google-fallback-freshness.mjs'
      - 'scripts/validate-google-freshness.mjs'
      - 'scripts/validate-google-snapshot.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/google-bootstrap.yml'
      - '.github/workflows/google-stale-fallback-watch.yml'
      - '.github/workflows/google-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/google-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/collect-google-careers.mjs'
      - 'scripts/collect-google-careers-fresh.mjs'
      - 'scripts/enforce-google-fallback-freshness.mjs'
      - 'scripts/validate-google-freshness.mjs'
      - 'scripts/validate-google-snapshot.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/google-bootstrap.yml'
      - '.github/workflows/google-stale-fallback-watch.yml'
      - '.github/workflows/google-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Google collector and fallback scripts
        run: |
          node --check scripts/collect-google-careers.mjs
          node --check scripts/collect-google-careers-fresh.mjs
          node --check scripts/enforce-google-fallback-freshness.mjs
          node --check scripts/validate-google-freshness.mjs
          node --check scripts/validate-google-snapshot.mjs
      - name: Test Google source-boundary helpers
        run: |
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/preserve-source-group.mjs --test
      - name: Guard Google refresh isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/google-bootstrap.yml'
          grep -Fq 'cp data/jobs.json /tmp/google-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Google" /tmp/google-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Google" /tmp/google-public-before.json --verify' "$workflow"
          grep -Fq 'node scripts/stamp-job-history.mjs --company "Google"' "$workflow"
          if grep -Eq '^[[:space:]]*run:[[:space:]]+node scripts/stamp-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::Google source refresh must not run unscoped job-history stamping.'
            exit 1
          fi
          if grep -Fq 'git add data/google-jobs.json data/jobs.json data/major-jobs.json' "$workflow"; then
            echo '::error::Google source refresh must not publish shared major-jobs mutations.'
            exit 1
          fi
      - name: Guard Google refresh cadence and source-writer safety
        run: |
          grep -Fq "cron: '47 */6 * * *'" .github/workflows/google-bootstrap.yml
          grep -Fq 'group: careers-source-writers' .github/workflows/google-bootstrap.yml
          node scripts/validate-source-workflow-isolation.mjs
      - name: Run Google fail-closed regression tests
        run: |
          node scripts/collect-google-careers.mjs --test-experience-parser
          node scripts/collect-google-careers-fresh.mjs --self-test
          node scripts/enforce-google-fallback-freshness.mjs --test
          node scripts/validate-google-freshness.mjs --test
          node scripts/validate-google-snapshot.mjs --test
      - name: Validate current Google publication state
        run: |
          node scripts/validate-google-freshness.mjs
          node scripts/validate-google-snapshot.mjs
          node scripts/validate-priority-employer-sources.mjs
