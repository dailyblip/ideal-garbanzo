name: H5 Data Centers source integrity guard

on:
  pull_request:
    paths:
      - 'scripts/collect-h5-data-centers.mjs'
      - 'scripts/validate-h5-data-centers.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/h5-data-centers-bootstrap.yml'
      - '.github/workflows/h5-source-integrity-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-h5-data-centers.mjs'
      - 'scripts/validate-h5-data-centers.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - '.github/workflows/h5-data-centers-bootstrap.yml'
      - '.github/workflows/h5-source-integrity-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector syntax and fail-closed contract
        run: |
          node --check scripts/collect-h5-data-centers.mjs
          node --check scripts/validate-h5-data-centers.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node --check scripts/validate-job-history.mjs
          node --check scripts/validate-source-workflow-isolation.mjs
          node scripts/validate-h5-data-centers.mjs --static-only
          node scripts/preserve-source-group.mjs --test
      - name: Guard H5 refresh isolation and history contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/h5-data-centers-bootstrap.yml'
          grep -Fq 'cp data/jobs.json /tmp/h5-public-before.json' "$workflow"
          if [ "$(grep -Fc 'node scripts/preserve-source-group.mjs "H5 Data Centers" /tmp/h5-public-before.json --verify' "$workflow")" -lt 3 ]; then
            echo '::error::H5 refresh must verify the non-H5 public-feed boundary in normal and race-safe paths.'
            exit 1
          fi
          if [ "$(grep -Fc 'node scripts/stamp-job-history.mjs --company "H5 Data Centers"' "$workflow")" -lt 2 ]; then
            echo '::error::H5 first-seen history stamping must remain scoped to H5 Data Centers in both normal and race-safe paths.'
            exit 1
          fi
          if [ "$(grep -Fc 'node scripts/validate-job-history.mjs --allow-aging' "$workflow")" -lt 2 ]; then
            echo '::error::H5 refresh must tolerate unrelated employers aging in both normal and race-safe validation paths.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(run:[[:space:]]+)?node scripts/stamp-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::H5 refresh must not run unscoped job-history stamping.'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*node scripts/validate-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::H5 refresh must not require unrelated employers to have freshly rewritten postedHours.'
            exit 1
          fi
          node scripts/validate-source-workflow-isolation.mjs
      - name: Protect approved homepage contract
        run: node scripts/validate-homepage-contract.mjs
