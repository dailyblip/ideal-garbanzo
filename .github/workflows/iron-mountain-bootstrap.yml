name: Bootstrap Iron Mountain data center roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-iron-mountain.mjs
      - scripts/validate-iron-mountain.mjs
      - scripts/enforce-iron-mountain-fallback-freshness.mjs
      - scripts/preserve-source-group.mjs
      - scripts/stamp-job-history.mjs
      - .github/workflows/iron-mountain-bootstrap.yml
  schedule:
    - cron: '48 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: iron-mountain-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Iron Mountain source and isolation scripts
        run: |
          node --check scripts/collect-iron-mountain.mjs
          node --check scripts/validate-iron-mountain.mjs
          node --check scripts/enforce-iron-mountain-fallback-freshness.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/collect-iron-mountain.mjs --test
          node scripts/validate-iron-mountain.mjs --test
          node scripts/enforce-iron-mountain-fallback-freshness.mjs --test
          node scripts/preserve-source-group.mjs --test
      - name: Preserve public-feed boundary before Iron Mountain refresh
        run: cp data/jobs.json /tmp/iron-mountain-public-before.json
      - name: Collect official Iron Mountain data center roles
        run: node scripts/collect-iron-mountain.mjs
      - name: Enforce Iron Mountain fallback freshness
        run: node scripts/enforce-iron-mountain-fallback-freshness.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize job locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Reapply Iron Mountain source boundary after shared transforms
        run: |
          node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json
          node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json --verify
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate Iron Mountain source health and parity
        run: node scripts/validate-iron-mountain.mjs
      - name: Track Iron Mountain first-seen dates
        run: node scripts/stamp-job-history.mjs --company "Iron Mountain"
      - name: Verify non-Iron Mountain rows remain unchanged after history stamping
        run: node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json --verify
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs --allow-aging
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Commit verified Iron Mountain roles
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/iron-mountain-public-before.json
            node --check scripts/preserve-source-group.mjs
            node --check scripts/stamp-job-history.mjs
            node scripts/collect-iron-mountain.mjs
            node scripts/enforce-iron-mountain-fallback-freshness.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json
            node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json --verify
            node scripts/refresh-region-status.mjs
            node scripts/validate-iron-mountain.mjs
            node scripts/stamp-job-history.mjs --company "Iron Mountain"
            node scripts/preserve-source-group.mjs "Iron Mountain" /tmp/iron-mountain-public-before.json --verify
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs --allow-aging
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          # Shared feed data can move while this source is being verified. Always
          # rebuild from the newest main snapshot instead of rebasing two generated
          # jobs.json versions, which can conflict or discard another source update.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Iron Mountain refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/iron-mountain-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No verified Iron Mountain data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Iron Mountain data center roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Iron Mountain publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Iron Mountain data after three attempts."
          exit 1
      - name: Deploy committed Iron Mountain data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
