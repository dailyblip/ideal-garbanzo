name: Jobs page visual QA

on:
  workflow_run:
    workflows: ["Refresh jobs and deploy site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: jobs-page-visual-qa
  cancel-in-progress: true

jobs:
  jobs-visual-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate jobs browser contract
        run: node scripts/validate-jobs-browser.mjs
      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Review live jobs page composition
        id: composition
        continue-on-error: true
        env:
          VISUAL_QA_BASE_URL: https://datacentercareers.us
          VISUAL_QA_OUTPUT_DIR: artifacts/jobs-page-visual-qa
          JOBS_QA_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node scripts/visual-jobs-page-qa.mjs
      - name: Upload jobs page screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-page-visual-qa-${{ github.run_id }}
          path: artifacts/jobs-page-visual-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Open or update jobs page visual blocker
        if: steps.composition.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Jobs page visual QA blocker';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            const body = [
              'Automated QA found a visual or responsive regression on the live /jobs/ page.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the uploaded desktop/tablet/iPhone screenshots and report before making additional jobs-page visual changes.'
            ].join('\n');
            if (existing) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Close recovered jobs page visual blocker
        if: steps.composition.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Jobs page visual QA blocker';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'Jobs page visual QA is healthy again. Closing this blocker.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Fail workflow on jobs page visual regression
        if: steps.composition.outcome == 'failure'
        run: exit 1
