name: Targeted major Workday recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover-major-workday-targeted.mjs'
      - 'scripts/prune-closed-major-workday.mjs'
      - 'scripts/validate-major-workday-parity.mjs'
      - '.github/workflows/major-workday-targeted-recovery.yml'
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: major-workday-targeted-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard targeted classifier and current snapshot traceability
        run: |
          node scripts/recover-major-workday-targeted.mjs --test
          node scripts/validate-major-workday-parity.mjs

      - name: Recover missing roles and prune closed Workday records
        id: recovery
        run: |
          node scripts/recover-major-workday-targeted.mjs
          node scripts/prune-closed-major-workday.mjs
          if git diff --quiet -- data/jobs.json data/major-jobs.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No newly verified roles or definitively closed priority Workday records found.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize and validate reconciled roles
        if: steps.recovery.outputs.changed == 'true'
        run: |
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
          node scripts/stamp-job-history.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-major-workday-parity.mjs

      - name: Commit reconciled priority Workday roles
        if: steps.recovery.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
          if git diff --cached --quiet; then
            echo 'Normalization left no data changes to commit.'
            exit 0
          fi
          git commit -m 'Reconcile targeted major-employer roles'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Deploy reconciled roles
        if: steps.recovery.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
