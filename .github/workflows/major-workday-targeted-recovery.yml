name: Targeted major Workday recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover-major-workday-targeted.mjs'
      - 'scripts/scrub-major-targeted-noise.mjs'
      - 'scripts/prune-closed-major-workday.mjs'
      - 'scripts/reconcile-major-jobs.mjs'
      - 'scripts/validate-major-workday-parity.mjs'
      - '.github/workflows/major-workday-targeted-recovery.yml'
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: major-workday-targeted-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard targeted classifier and current snapshot traceability
        run: |
          node scripts/recover-major-workday-targeted.mjs --test
          node scripts/scrub-major-targeted-noise.mjs --test
          node scripts/validate-major-workday-parity.mjs

      - name: Recover missing roles and prune closed Workday records
        id: recovery
        run: |
          node scripts/recover-major-workday-targeted.mjs
          node scripts/prune-closed-major-workday.mjs
          node scripts/scrub-major-targeted-noise.mjs
          node scripts/reconcile-major-jobs.mjs --preserve-existing

          roles_changed=false
          status_changed=false
          if ! git diff --quiet -- data/jobs.json data/major-jobs.json; then
            roles_changed=true
          fi
          if ! git diff --quiet -- data/collector-status.json; then
            status_changed=true
          fi

          echo "roles_changed=${roles_changed}" >> "$GITHUB_OUTPUT"
          echo "status_changed=${status_changed}" >> "$GITHUB_OUTPUT"
          if [ "$roles_changed" = true ] || [ "$status_changed" = true ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No newly verified roles, definitively closed records, corporate-noise removals, source-health changes, or location corrections found.'
          fi

      - name: Normalize and validate reconciled roles
        if: steps.recovery.outputs.roles_changed == 'true'
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
          node scripts/stamp-job-history.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-major-workday-parity.mjs

      - name: Commit targeted recovery state
        if: steps.recovery.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Employer-specific writers and the global publication guard can move
          # main while the official Workday liveness scan is running. Rebasing
          # generated JSON snapshots creates avoidable conflicts, so rebuild the
          # recovery from the newest main and retry the push instead.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Main moved during recovery; rebuilding from latest main (attempt ${attempt})."
              git reset --hard origin/main

              node scripts/recover-major-workday-targeted.mjs
              node scripts/prune-closed-major-workday.mjs
              node scripts/scrub-major-targeted-noise.mjs
              node scripts/reconcile-major-jobs.mjs --preserve-existing
              node scripts/filter-mission-fit.mjs
              node scripts/normalize-job-locations.mjs
              node scripts/dedupe-normalized-jobs.mjs
              node scripts/normalize-display-copy.mjs
              node scripts/stamp-job-history.mjs
              node scripts/refresh-region-status.mjs
              node scripts/validate.mjs
              node scripts/validate-job-history.mjs
              node scripts/validate-priority-employer-sources.mjs
              node scripts/validate-major-workday-parity.mjs
            fi

            git add data/jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo 'Targeted recovery left no data changes to commit.'
              exit 0
            fi

            git commit -m 'Reconcile targeted major-employer roles and health'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main moved before targeted recovery push completed; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo '::error::Could not publish targeted Workday recovery after three fresh rebuilds.'
          exit 1

      - name: Deploy reconciled roles
        if: steps.recovery.outputs.roles_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
