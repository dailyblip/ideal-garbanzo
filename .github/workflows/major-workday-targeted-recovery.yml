name: Targeted major Workday recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover-major-workday-targeted.mjs'
      - 'scripts/scrub-major-targeted-noise.mjs'
      - 'scripts/prune-closed-major-workday.mjs'
      - 'scripts/reconcile-major-jobs.mjs'
      - 'scripts/validate-major-workday-health.mjs'
      - 'scripts/validate-major-workday-parity.mjs'
      - '.github/workflows/major-workday-targeted-recovery.yml'
  schedule:
    - cron: '44 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# This recovery mutates the same shared jobs feed as the dedicated ATS writers.
# Join their queue so long Workday verification runs do not repeatedly lose the
# final push race to another shared-feed publisher.
concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard targeted classifier and current snapshot traceability
        run: |
          node scripts/recover-major-workday-targeted.mjs --test
          node scripts/prune-closed-major-workday.mjs --test
          node scripts/scrub-major-targeted-noise.mjs --test
          node scripts/validate-major-workday-health.mjs
          node scripts/validate-major-workday-parity.mjs

      - name: Recover missing roles and prune closed Workday records
        id: recovery
        run: |
          node scripts/recover-major-workday-targeted.mjs
          # Drop corporate/program noise before the per-role liveness pass so
          # official detail checks and roleEvidence only cover publishable roles.
          node scripts/scrub-major-targeted-noise.mjs
          node scripts/prune-closed-major-workday.mjs
          node scripts/reconcile-major-jobs.mjs --preserve-existing

          roles_changed=false
          status_changed=false
          if ! git diff --quiet -- data/jobs.json data/major-jobs.json; then
            roles_changed=true
          fi
          if ! git diff --quiet -- data/collector-status.json; then
            status_changed=true
          fi

          echo "roles_changed=${roles_changed}" >> "$GITHUB_OUTPUT"
          echo "status_changed=${status_changed}" >> "$GITHUB_OUTPUT"
          if [ "$roles_changed" = true ] || [ "$status_changed" = true ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No newly verified roles, definitively closed records, corporate-noise removals, source-health changes, or location corrections found.'
          fi

      - name: Validate refreshed Workday source health
        if: steps.recovery.outputs.changed == 'true'
        run: node scripts/validate-major-workday-health.mjs

      - name: Normalize and validate reconciled roles
        if: steps.recovery.outputs.roles_changed == 'true'
        run: |
          node scripts/filter-mission-fit.mjs
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
          node scripts/normalize-display-copy.mjs
          node scripts/stamp-job-history.mjs
          node scripts/refresh-region-status.mjs
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-major-workday-health.mjs
          node scripts/validate-major-workday-parity.mjs

      - name: Commit targeted recovery state
        if: steps.recovery.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/recover-major-workday-targeted.mjs
            node scripts/scrub-major-targeted-noise.mjs
            node scripts/prune-closed-major-workday.mjs
            node scripts/reconcile-major-jobs.mjs --preserve-existing
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/normalize-display-copy.mjs
            node scripts/stamp-job-history.mjs
            node scripts/refresh-region-status.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-major-workday-health.mjs
            node scripts/validate-major-workday-parity.mjs
          }

          # Employer-specific writers and the global publication guard can move
          # main while the official Workday liveness scan is running. Rebuild from
          # the newest shared-feed state rather than rebasing generated snapshots.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during targeted recovery; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          # The shared queue prevents collisions with the busiest ATS writers;
          # bounded retries still protect against independently queued publishers.
          for attempt in 1 2 3 4 5; do
            git add data/jobs.json data/major-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo 'Targeted recovery left no data changes to commit.'
              exit 0
            fi

            git commit -m 'Reconcile targeted major-employer roles and health'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main moved before targeted recovery push completed (attempt ${attempt}); rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo '::error::Could not publish targeted Workday recovery after five fresh rebuilds.'
          exit 1

      - name: Deploy reconciled recovery state
        if: steps.recovery.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
