name: Bootstrap Meta Careers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-bootstrap.yml'
      - 'scripts/collect-meta-careers.mjs'
      - 'scripts/recover-meta-structured.mjs'
      - 'scripts/normalize-meta-compensation.mjs'
      - 'scripts/validate-meta-snapshot.mjs'

permissions:
  actions: write
  contents: write

# Keep duplicate Meta runs from overlapping. Shared pipeline edits are validated
# by the main build instead of fanning out multiple feed-writing source jobs.
concurrency:
  group: meta-bootstrap
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official Meta Careers roles
        run: node scripts/collect-meta-careers.mjs
      - name: Recover Meta requirements from structured data
        run: node scripts/recover-meta-structured.mjs
      - name: Test Meta compensation normalization
        run: node scripts/normalize-meta-compensation.mjs --test
      - name: Normalize missing Meta compensation
        run: node scripts/normalize-meta-compensation.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate refreshed feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-meta-snapshot.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish Meta snapshot from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-meta-careers.mjs
            node scripts/recover-meta-structured.mjs
            node scripts/normalize-meta-compensation.mjs --test
            node scripts/normalize-meta-compensation.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-meta-snapshot.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Meta collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/meta-jobs.json data/jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Meta Careers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Bootstrap verified Meta Careers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Meta publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Meta Careers roles after three attempts."
          exit 1
      - name: Deploy committed Meta data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
