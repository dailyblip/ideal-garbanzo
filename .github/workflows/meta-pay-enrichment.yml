name: Meta compensation enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-pay-enrichment.yml'
      - 'scripts/enrich-meta-pay.mjs'
  workflow_run:
    workflows:
      - 'Refresh jobs and deploy site'
      - 'Bootstrap Meta Careers'
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: meta-compensation-enrichment-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || 'direct' }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'push' }}
  cancel-in-progress: true

jobs:
  enrich:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Bootstrap Meta Careers' ||
        github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate enrichment script
        run: node --check scripts/enrich-meta-pay.mjs
      - name: Recover employer-listed Meta compensation
        run: node scripts/enrich-meta-pay.mjs
      - name: Validate Meta feed after enrichment
        run: |
          node scripts/validate.mjs
          node scripts/validate-meta-snapshot.mjs
      - name: Commit compensation updates when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/meta-jobs.json data/jobs.json data/collector-status.json)" ]; then
            echo "No Meta compensation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta-jobs.json data/jobs.json data/collector-status.json
          git commit -m "Refresh employer-listed Meta compensation"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Could not rebase Meta compensation updates onto current main."
            exit 1
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy compensation updates
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
