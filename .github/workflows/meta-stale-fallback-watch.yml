name: Meta stale fallback watchdog

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/meta-jobs.json'
      - 'scripts/collect-meta-careers.mjs'
      - 'scripts/recover-meta-structured.mjs'
      - 'scripts/normalize-meta-compensation.mjs'
      - 'scripts/enforce-meta-fallback-freshness.mjs'
      - 'scripts/validate-meta-snapshot.mjs'
      - '.github/workflows/meta-stale-fallback-watch.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: meta-stale-fallback-watch
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Meta stale-fallback policy
        run: node scripts/enforce-meta-fallback-freshness.mjs --test
      - name: Verify Meta sitemap and enforce fallback freshness
        run: node scripts/enforce-meta-fallback-freshness.mjs
      - name: Test Meta compensation normalization
        run: node scripts/normalize-meta-compensation.mjs --test
      - name: Normalize missing Meta compensation
        run: node scripts/normalize-meta-compensation.mjs
      - name: Validate Meta snapshot state
        run: node scripts/validate-meta-snapshot.mjs
      - name: Publish Meta freshness state from current main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/enforce-meta-fallback-freshness.mjs --test
            node scripts/enforce-meta-fallback-freshness.mjs
            node scripts/normalize-meta-compensation.mjs --test
            node scripts/normalize-meta-compensation.mjs
            node scripts/validate-meta-snapshot.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Meta freshness enforcement; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add -u -- data/jobs.json data/meta-jobs.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "Meta freshness state is unchanged."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Verify Meta role freshness"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Meta freshness publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish Meta freshness state after three attempts."
          exit 1
      - name: Deploy Meta freshness change
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
