name: Refresh Microsoft employer-direct feed

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-microsoft-datacenter.mjs'
      - 'scripts/run-microsoft-datacenter.mjs'
      - 'scripts/apply-microsoft-verified-fallback.mjs'
      - 'scripts/apply-microsoft-verified-publish.mjs'
      - 'scripts/persist-microsoft-snapshot.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - '.github/workflows/microsoft-bootstrap.yml'

permissions:
  contents: write
  actions: write

# Prevent duplicate Microsoft refreshes without sharing a pending slot with
# unrelated employer workflows.
concurrency:
  group: microsoft-bootstrap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Microsoft experience, pacing and source-isolation policy
        run: |
          node --check scripts/collect-microsoft-datacenter.mjs
          node --check scripts/run-microsoft-datacenter.mjs
          node --check scripts/apply-microsoft-verified-publish.mjs
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/collect-microsoft-datacenter.mjs --test-experience-parser
          node scripts/run-microsoft-datacenter.mjs --test-rate-limit-policy
          node scripts/apply-microsoft-verified-publish.mjs --test
          node scripts/preserve-source-group.mjs --test
      - name: Preserve public-feed boundary before Microsoft refresh
        run: cp data/jobs.json /tmp/microsoft-public-before.json
      - name: Restore fresh Microsoft snapshot before direct refresh
        run: node scripts/apply-microsoft-verified-fallback.mjs
      - name: Collect official Microsoft data center roles with adaptive pacing
        run: node scripts/run-microsoft-datacenter.mjs
      - name: Enforce mission-fit roles
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Reapply Microsoft source boundary after shared transforms
        run: |
          node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json
          node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json --verify
      - name: Persist freshly verified publishable Microsoft snapshot
        run: node scripts/persist-microsoft-snapshot.mjs
      - name: Persist Microsoft first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs --company "Microsoft"
      - name: Verify non-Microsoft rows remain unchanged after history stamping
        run: node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json --verify
      - name: Validate employer-direct sources and feed
        run: |
          node scripts/validate-microsoft-snapshot.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate.mjs
      - name: Publish refreshed Microsoft roles from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A degraded Microsoft run deliberately retains the last verified
          # snapshot. There is no newly verified employer state to publish in
          # that case. Skipping publication also prevents a concurrent main
          # update from forcing the old retained snapshot through the short
          # race-transfer freshness window used only for fresh crawls.
          fresh_direct_refresh="$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/collector-status.json','utf8')).microsoftDatacenter||{}; process.stdout.write(s.sourceHealthy===true && s.sourceMode!=='retained-previous' ? 'true' : 'false')")"
          if [ "$fresh_direct_refresh" != "true" ]; then
            echo "Microsoft direct refresh was not freshly healthy; leaving the last verified Microsoft publication unchanged."
            git fetch origin main
            git reset --hard origin/main
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve the already-collected and validated employer-direct result.
          # If another source advances main while this workflow is publishing,
          # transplant only this verified Microsoft state onto that newer main
          # instead of repeatedly crawling Microsoft and widening the race window.
          cp data/microsoft-jobs.json /tmp/microsoft-jobs-verified.json
          cp data/collector-status.json /tmp/microsoft-status-verified.json

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/microsoft-public-before.json
            node scripts/apply-microsoft-verified-publish.mjs /tmp/microsoft-jobs-verified.json /tmp/microsoft-status-verified.json
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json
            node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json --verify
            node scripts/stamp-job-history.mjs --company "Microsoft"
            node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json --verify
            node scripts/validate-microsoft-snapshot.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Microsoft refresh; applying the verified Microsoft snapshot onto latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3 4 5; do
            git add data/jobs.json data/microsoft-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Microsoft data or job-history changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Microsoft jobs and history"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Main moved during Microsoft publish attempt ${attempt}; applying the same verified snapshot onto latest main before retry."
              sleep $((attempt * 2))
              rebuild_from_latest_main
            fi
          done

          echo "::error::Could not publish verified Microsoft roles after five race-safe attempts."
          exit 1
      - name: Deploy committed Microsoft data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not start another workflow run.
          # Explicitly dispatch the deploy-only path so the verified data commit
          # reaches GitHub Pages and the custom-domain smoke test immediately.
          gh workflow run pages.yml --ref main -f deploy_only=true
