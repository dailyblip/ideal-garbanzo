name: Microsoft source integrity guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/microsoft-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/collect-microsoft-datacenter.mjs'
      - 'scripts/run-microsoft-datacenter.mjs'
      - 'scripts/persist-microsoft-snapshot.mjs'
      - 'scripts/apply-microsoft-verified-fallback.mjs'
      - 'scripts/apply-microsoft-verified-publish.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - '.github/workflows/microsoft-bootstrap.yml'
      - '.github/workflows/microsoft-source-integrity-guard.yml'
  push:
    branches: [main]
    paths:
      - 'data/microsoft-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/collect-microsoft-datacenter.mjs'
      - 'scripts/run-microsoft-datacenter.mjs'
      - 'scripts/persist-microsoft-snapshot.mjs'
      - 'scripts/apply-microsoft-verified-fallback.mjs'
      - 'scripts/apply-microsoft-verified-publish.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history.mjs'
      - '.github/workflows/microsoft-bootstrap.yml'
      - '.github/workflows/microsoft-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Microsoft requisition parity
        run: node scripts/validate-microsoft-snapshot.mjs --test
      - name: Test Microsoft experience policy
        run: node scripts/collect-microsoft-datacenter.mjs --test-experience-parser
      - name: Test Microsoft request-throttle policy
        run: |
          node --check scripts/run-microsoft-datacenter.mjs
          node scripts/run-microsoft-datacenter.mjs --test-rate-limit-policy
      - name: Test Microsoft source-boundary helpers
        run: |
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history.mjs
          node scripts/preserve-source-group.mjs --test
      - name: Guard Microsoft refresh isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/microsoft-bootstrap.yml'
          grep -Fq 'cp data/jobs.json /tmp/microsoft-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json' "$workflow"
          grep -Fq 'node scripts/preserve-source-group.mjs "Microsoft" /tmp/microsoft-public-before.json --verify' "$workflow"
          grep -Fq 'node scripts/stamp-job-history.mjs --company "Microsoft"' "$workflow"
          if grep -Eq '^[[:space:]]*run:[[:space:]]+node scripts/stamp-job-history\.mjs[[:space:]]*$' "$workflow"; then
            echo '::error::Microsoft source refresh must not run unscoped job-history stamping.'
            exit 1
          fi
      - name: Validate Microsoft employer-direct snapshot and public feed
        run: node scripts/validate-microsoft-snapshot.mjs
