name: Microsoft source integrity guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/microsoft-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/collect-microsoft-datacenter.mjs'
      - 'scripts/run-microsoft-datacenter.mjs'
      - 'scripts/persist-microsoft-snapshot.mjs'
      - 'scripts/apply-microsoft-verified-fallback.mjs'
      - '.github/workflows/microsoft-source-integrity-guard.yml'
  push:
    branches: [main]
    paths:
      - 'data/microsoft-jobs.json'
      - 'data/jobs.json'
      - 'data/collector-status.json'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/collect-microsoft-datacenter.mjs'
      - 'scripts/run-microsoft-datacenter.mjs'
      - 'scripts/persist-microsoft-snapshot.mjs'
      - 'scripts/apply-microsoft-verified-fallback.mjs'
      - '.github/workflows/microsoft-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Microsoft requisition parity
        run: node scripts/validate-microsoft-snapshot.mjs --test
      - name: Test Microsoft request-throttle policy
        run: |
          node --check scripts/run-microsoft-datacenter.mjs
          node scripts/run-microsoft-datacenter.mjs --test-rate-limit-policy
      - name: Validate Microsoft employer-direct snapshot and public feed
        run: node scripts/validate-microsoft-snapshot.mjs
