name: Mission-fit publication guard

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/major-jobs.json'
      - 'data/job-history.json'
      - 'data/career-events.json'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/normalize-job-locations.mjs'
      - 'scripts/prune-unresolved-geography.mjs'
      - 'scripts/sync-publication-counts.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/refresh-career-events.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/sync-major-reconciliation-status.mjs'
      - '.github/workflows/mission-fit-publication-guard.yml'
  # Commits made with the default Actions token do not recursively start new
  # push workflows. This cheap scheduled pass therefore also catches output
  # from employer-specific writers that publish between the daily full refreshes.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mission-fit-publication-guard
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate publication guard scripts
        run: |
          node --check scripts/filter-mission-fit.mjs
          node --check scripts/normalize-job-locations.mjs
          node --check scripts/prune-unresolved-geography.mjs
          node --check scripts/sync-publication-counts.mjs
          node --check scripts/dedupe-normalized-jobs.mjs
          node --check scripts/stamp-job-history.mjs
          node --check scripts/refresh-career-events.mjs
          node --check scripts/validate-job-history.mjs
          node --check scripts/sync-major-reconciliation-status.mjs
      - name: Enforce mission fit and publish a clean feed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Several employer-specific refresh workflows write data/jobs.json.
          # Rebuild from the latest main on every attempt so a concurrent source
          # refresh cannot reintroduce corporate, senior, security, or foreign
          # roles after the primary daily refresh has already cleaned the feed.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            # The public product is U.S.-only. If normalization cannot resolve a
            # role to a supported U.S. region, fail closed instead of publishing
            # an unfilterable or clearly foreign location.
            node scripts/prune-unresolved-geography.mjs
            node scripts/sync-publication-counts.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs --repair-only
            # Midnight must not leave yesterday's event in a feed that otherwise
            # passes publication QA. This mode is local/deterministic and does not
            # depend on organizer sites being reachable during a guard run.
            node scripts/refresh-career-events.mjs --prune-expired-only
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs --allow-aging
            node scripts/validate-priority-employer-sources.mjs

            # The transforms above update diagnostic timestamps in collector-status
            # on every run, and those clock-only changes should not create commits.
            # Restore the committed diagnostics, then re-sync only publication counts
            # that changed because of a proven prune/dedupe repair. The major-status
            # repair script separately protects exact Workday reconciliation parity.
            git checkout -- data/collector-status.json
            node scripts/sync-publication-counts.mjs
            node scripts/sync-major-reconciliation-status.mjs
            node scripts/validate-major-workday-parity.mjs

            # Guard only publishable feed/history state plus count/reconciliation
            # repairs when they were actually needed. With collector-status restored
            # before deterministic synchronization, clock-only diagnostics stay out.
            git add -- data/jobs.json data/major-jobs.json data/job-history.json data/career-events.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "Committed feed already satisfies mission-fit publication rules."
              # A push into a guarded publication path still needs a deployment
              # even when normalization itself produced no additional diff.
              if [ "${{ github.event_name }}" = "push" ]; then
                echo 'deploy=true' >> "$GITHUB_OUTPUT"
              else
                echo 'deploy=false' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            git commit -m "Enforce mission-fit publication guard"
            if git push origin HEAD:main; then
              # Actions-token commits do not trigger downstream push workflows,
              # so explicitly request a deploy after publishing repaired data.
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during publication guard attempt ${attempt}; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish a mission-fit feed after three attempts."
          exit 1

      - name: Deploy guarded publication state
        if: steps.publish.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true; then
              echo 'Deployment requested for the guarded main revision.'
              exit 0
            fi
            echo "Deployment dispatch failed on attempt ${attempt}; retrying."
            sleep $((attempt * 2))
          done
          echo '::error::Could not dispatch Pages after publishing guarded feed state.'
          exit 1
