name: Mission-fit publication validation

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/validate-mission-fit-publication.mjs'
      - '.github/workflows/mission-fit-publication-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/validate-mission-fit-publication.mjs'
      - '.github/workflows/mission-fit-publication-validation.yml'
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-fit-publication-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate mission-fit publication state
        run: node scripts/validate-mission-fit-publication.mjs
