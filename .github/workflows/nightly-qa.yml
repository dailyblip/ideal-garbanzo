name: Nightly site QA

# Production QA entrypoint for scheduled, manual, and on-demand verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly-qa.yml'
      - 'scripts/reconcile-qa-dead-snapshots.mjs'
  workflow_dispatch:
  schedule:
    - cron: '5 5 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-site-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rehydrate active verified CoreSite fallback
        run: node scripts/apply-coresite-verified-fallback.mjs
      - name: Re-assert CoreSite fallback freshness after rehydration
        run: node scripts/enforce-coresite-fallback-freshness.mjs
      - name: Normalize rehydrated fallback jobs
        run: |
          node scripts/normalize-job-locations.mjs
          node scripts/dedupe-normalized-jobs.mjs
      - name: Run full live QA
        run: node scripts/qa-site.mjs
      - name: Reconcile confirmed-dead source snapshots
        run: |
          node scripts/reconcile-qa-dead-snapshots.mjs --test
          node scripts/reconcile-qa-dead-snapshots.mjs
      - name: Refresh post-QA regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Preserve job discovery history after QA
        run: node scripts/stamp-job-history.mjs
      - name: Validate cleaned site data
        run: |
          node scripts/validate.mjs
          node scripts/validate-promotions.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-coresite-fallback.mjs
      - name: Print QA report
        run: cat data/qa-report.json
      - name: Commit safe QA corrections when needed
        id: corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Use the reconciler's ownership manifest, including wrapped snapshots
          # and count-only sidecars. Every confirmed-dead removal must be atomic.
          load_qa_paths() {
            node scripts/reconcile-qa-dead-snapshots.mjs --list-paths > /tmp/qa-snapshot-paths.txt
            mapfile -t snapshot_paths < /tmp/qa-snapshot-paths.txt
            test "${#snapshot_paths[@]}" -gt 0
            qa_paths=(data/jobs.json data/job-history.json data/career-events.json data/collector-status.json data/qa-report.json "${snapshot_paths[@]}")
          }
          load_qa_paths

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            load_qa_paths
            node scripts/apply-coresite-verified-fallback.mjs
            node scripts/enforce-coresite-fallback-freshness.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/qa-site.mjs
            node scripts/reconcile-qa-dead-snapshots.mjs --test
            node scripts/reconcile-qa-dead-snapshots.mjs
            node scripts/refresh-region-status.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-promotions.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-coresite-fallback.mjs
          }

          qa_base="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$qa_base" ] || [ "$(git rev-parse HEAD)" != "$qa_base" ]; then
              echo "Main moved during QA; rechecking current data before publishing."
              rebuild_from_latest_main
              qa_base="$(git rev-parse HEAD)"
            fi
            if git diff --quiet -- "${qa_paths[@]}"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No QA corrections required."
              exit 0
            fi
            git add -- "${qa_paths[@]}"
            git commit -m "Apply nightly site QA corrections"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main moved before QA publication; rebuilding before retry."
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish QA corrections after three fresh-main attempts."
          exit 1
      - name: Deploy corrected feed
        if: steps.corrections.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -f deploy_only=true
