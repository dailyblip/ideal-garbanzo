name: Bootstrap Oracle Careers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-bootstrap.yml'
      - 'scripts/collect-oracle-careers.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/stamp-job-history.mjs'

permissions:
  actions: write
  contents: write

concurrency:
  group: oracle-careers-bootstrap
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official Oracle Careers roles
        run: node scripts/collect-oracle-careers.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate refreshed feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Commit Oracle snapshot when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/oracle-jobs.json data/jobs.json data/job-history.json data/collector-status.json)" ]; then
            echo "No Oracle Careers data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oracle-jobs.json data/jobs.json data/job-history.json data/collector-status.json
          git commit -m "Bootstrap verified Oracle Careers roles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy committed Oracle data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
