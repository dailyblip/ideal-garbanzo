name: Bootstrap Oracle Careers

on:
  workflow_dispatch:
  schedule:
    - cron: '4 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-oracle-careers.mjs'
      - 'scripts/preserve-source-posted-hours.mjs'
      - 'scripts/stamp-oracle-source-freshness.mjs'
      - 'scripts/scrub-oracle-mission-fit.mjs'
      - 'scripts/validate-oracle-snapshot.mjs'
      - '.github/workflows/oracle-bootstrap.yml'

permissions:
  actions: write
  contents: write

# Prevent duplicate Oracle refreshes without sharing a pending slot with
# unrelated employer workflows.
concurrency:
  group: oracle-bootstrap
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Oracle source-isolation helper
        run: |
          node --check scripts/preserve-source-posted-hours.mjs
          node scripts/preserve-source-posted-hours.mjs --test
      - name: Capture pre-Oracle public-feed state
        run: cp data/jobs.json /tmp/oracle-jobs-baseline.json
      - name: Collect official Oracle Careers roles
        run: node scripts/collect-oracle-careers.mjs
      - name: Restore non-Oracle freshness fields
        run: node scripts/preserve-source-posted-hours.mjs Oracle /tmp/oracle-jobs-baseline.json
      - name: Persist Oracle source freshness evidence
        run: |
          node scripts/stamp-oracle-source-freshness.mjs --test
          node scripts/stamp-oracle-source-freshness.mjs
      - name: Scrub non-operational Oracle role families
        run: node scripts/scrub-oracle-mission-fit.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate refreshed feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-oracle-snapshot.mjs
      - name: Publish Oracle snapshot from current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            cp data/jobs.json /tmp/oracle-jobs-baseline.json
            node scripts/collect-oracle-careers.mjs
            node scripts/preserve-source-posted-hours.mjs Oracle /tmp/oracle-jobs-baseline.json
            node scripts/stamp-oracle-source-freshness.mjs
            node scripts/scrub-oracle-mission-fit.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-oracle-snapshot.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Oracle collection; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            # Publish only Oracle-owned feed artifacts plus the shared public-feed
            # and history files that this source refresh intentionally updates.
            git add data/jobs.json data/oracle-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Oracle Careers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Bootstrap verified Oracle Careers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Oracle publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Oracle Careers roles after three attempts."
          exit 1
      - name: Deploy committed Oracle data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
