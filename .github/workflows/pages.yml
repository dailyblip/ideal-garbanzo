name: Refresh jobs and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-center-careers
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh employer-direct jobs
        run: node scripts/collect-jobs.mjs
      - name: Validate site and job data
        run: node scripts/validate.mjs
      - name: Commit refreshed jobs when changed
        run: |
          if git diff --quiet -- data/jobs.json data/collector-status.json; then
            echo "No job data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json data/collector-status.json
            git commit -m "Refresh verified data center jobs"
            git push
          fi

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site and job data
        run: node scripts/validate.mjs

  deploy:
    needs: [validate]
    if: always() && needs.validate.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
