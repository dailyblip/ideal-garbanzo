name: Refresh jobs and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-center-careers
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh employer-direct jobs
        run: node scripts/collect-jobs.mjs
      - name: Merge priority major-employer jobs
        run: node scripts/collect-major-jobs.mjs
      - name: Add early-career internships and training roles
        run: node scripts/collect-early-career.mjs
      - name: Add official AWS data center roles
        run: node scripts/collect-amazon-datacenter.mjs
      - name: Add official Microsoft datacenter roles
        run: node scripts/collect-microsoft-datacenter.mjs
      - name: Add official Equinix careers roles
        run: node scripts/collect-equinix-v2.mjs
      - name: Add Equinix US early-career roles
        run: node scripts/collect-equinix-early.mjs
      - name: Normalize job locations
        run: node scripts/normalize-job-locations.mjs
      - name: Run live link and duplicate QA
        run: node scripts/qa-site.mjs
      - name: Validate site and job data
        run: node scripts/validate.mjs
      - name: Commit refreshed jobs when changed
        run: |
          if git diff --quiet -- data/jobs.json data/major-jobs.json data/amazon-jobs.json data/collector-status.json data/qa-report.json; then
            echo "No job or QA data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json data/major-jobs.json data/amazon-jobs.json data/collector-status.json data/qa-report.json
            git commit -m "Refresh verified jobs and QA report"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  deploy:
    needs: [refresh]
    if: always() && needs.refresh.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate crawlable SEO pages
        run: node scripts/generate-seo.mjs
      - name: Validate latest main before deployment
        run: |
          node scripts/validate.mjs
          test -s sitemap.xml
          test -s robots.txt
          test -s jobs/index.html
          test -s apprenticeships/index.html
          test -s internships/index.html
          test -s entry-level/index.html
          test -s career-events/index.html
          grep -R -m1 '"@type":"JobPosting"' jobs/*/index.html >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
