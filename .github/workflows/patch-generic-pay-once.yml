name: Patch generic ATS missing-pay contract

on:
  push:
    branches:
      - fix/generic-ats-blank-missing-pay-20260913
    paths:
      - '.github/workflows/patch-generic-pay-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-ats-blank-missing-pay-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch generic ATS missing-pay contract
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('scripts/collect-jobs-core.mjs')
          text = core.read_text()
          old = "function payObject(label='Pay not listed', min=null, max=null, interval='') {"
          new = "function payObject(label='', min=null, max=null, interval='') {"
          if old not in text and new not in text:
              raise SystemExit('Expected generic ATS payObject signature not found')
          text = text.replace(old, new, 1)

          anchor = """function extractAshbyPay(compensation, description='') {
            const parts = compensation?.summaryComponents || [];
            const salary = parts.find(part => part?.compensationType === 'Salary' && Number.isFinite(part?.maxValue));
            if (!salary) return extractPay(description);
            const min = Number.isFinite(salary.minValue) ? salary.minValue : null;
            const max = Number.isFinite(salary.maxValue) ? salary.maxValue : null;
            const hourly = /HOUR/i.test(String(salary.interval || ''));
            const fmt = value => value == null ? '' : Number(value).toLocaleString('en-US',{maximumFractionDigits:2});
            const label = min != null && max != null ? `$${fmt(min)}–$${fmt(max)} / ${hourly ? 'hr' : 'year'}` : (compensation?.scrapeableCompensationSalarySummary || 'Pay listed on employer site');
            return payObject(label, min, max, hourly ? 'hour' : 'year');
          }
          """
          tests = """
          if (process.argv.includes('--test-pay-parser')) {
            const missing = extractPay('Maintain critical facilities equipment. Compensation is not listed.');
            if (missing.pay !== '' || missing.salaryMin !== null || missing.salaryMax !== null || missing.salarySortMax !== null) {
              throw new Error(`Generic ATS missing-pay regression: expected blank/null fields, got ${JSON.stringify(missing)}`);
            }

            const hourly = extractPay('Compensation: $25-$30 per hour.');
            if (hourly.pay !== '$25–$30 / hr' || hourly.salaryMin !== 25 || hourly.salaryMax !== 30 || hourly.salarySortMax !== 62400) {
              throw new Error(`Generic ATS hourly-pay regression: ${JSON.stringify(hourly)}`);
            }

            const annual = extractPay('Salary range: $60,000 to $72,000 annually.');
            if (annual.pay !== '$60,000–$72,000 / year' || annual.salaryMin !== 60000 || annual.salaryMax !== 72000 || annual.salarySortMax !== 72000) {
              throw new Error(`Generic ATS annual-pay regression: ${JSON.stringify(annual)}`);
            }

            console.log('Generic ATS pay parser passed missing, hourly, and annual regression cases.');
            process.exit(0);
          }
          """
          if "process.argv.includes('--test-pay-parser')" not in text:
              if anchor not in text:
                  raise SystemExit('Expected Ashby pay parser anchor not found')
              text = text.replace(anchor, anchor + tests, 1)
          core.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check scripts/collect-jobs-core.mjs
          node scripts/collect-jobs.mjs --test-experience-parser
          node scripts/collect-jobs-core.mjs --test-pay-parser
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet -- scripts/collect-jobs-core.mjs; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect-jobs-core.mjs
          git commit -m 'Keep missing generic ATS pay blank'
          git push origin HEAD:fix/generic-ats-blank-missing-pay-20260913
