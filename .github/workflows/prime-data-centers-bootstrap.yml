name: Bootstrap Prime Data Centers roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-prime-data-centers.mjs
      - scripts/reconcile-prime-data-centers.mjs
      - scripts/enforce-prime-fallback-freshness.mjs
      - scripts/validate-prime-data-centers.mjs
  workflow_dispatch:
  schedule:
    - cron: '59 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector and parsers
        run: |
          node --check scripts/collect-prime-data-centers.mjs
          node --check scripts/reconcile-prime-data-centers.mjs
          node --check scripts/enforce-prime-fallback-freshness.mjs
          node --check scripts/validate-prime-data-centers.mjs
          node scripts/collect-prime-data-centers.mjs --test-classifier
          node scripts/collect-prime-data-centers.mjs --test-next-data
          node scripts/enforce-prime-fallback-freshness.mjs --test
      - name: Collect official Prime Rippling roles
        run: node scripts/collect-prime-data-centers.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Reconcile Prime authoritative snapshot
        run: node scripts/reconcile-prime-data-centers.mjs
      - name: Verify Prime source freshness
        run: node scripts/enforce-prime-fallback-freshness.mjs
      - name: Run live QA
        run: node scripts/qa-site.mjs
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate Prime employer-direct snapshot
        run: node scripts/validate-prime-data-centers.mjs
      - name: Track first-seen dates
        run: node scripts/stamp-job-history.mjs
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
          node scripts/validate-source-workflow-isolation.mjs
      - name: Commit verified Prime roles
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-prime-data-centers.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/reconcile-prime-data-centers.mjs
            node scripts/enforce-prime-fallback-freshness.mjs --test
            node scripts/enforce-prime-fallback-freshness.mjs
            node scripts/qa-site.mjs
            node scripts/refresh-region-status.mjs
            node scripts/validate-prime-data-centers.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
            node scripts/validate-source-workflow-isolation.mjs
          }

          # Shared feed data can move while this source is being verified. Always
          # rebuild from the newest main snapshot rather than rebasing independently
          # generated jobs.json versions and risking loss of another source update.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Prime refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/prime-data-centers-jobs.json data/job-history.json data/collector-status.json data/career-events.json data/qa-report.json
            if git diff --cached --quiet; then
              echo "No verified Prime Data Centers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Prime Data Centers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Prime publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Prime Data Centers data after three attempts."
          exit 1
      - name: Deploy committed Prime data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
