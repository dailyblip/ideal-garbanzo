name: Probe Prime careers source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prime-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official Prime careers page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 30 -D /tmp/headers.txt \
            -A 'DataCenterCareersSourceProbe/1.0 (+https://datacentercareers.us/)' \
            'https://primedatacenters.com/careers/' -o /tmp/prime-careers.html
          echo '=== RESPONSE HEADERS ==='
          cat /tmp/headers.txt
          echo '=== DOCUMENT SIZE ==='
          wc -c /tmp/prime-careers.html
          echo '=== UNIQUE EXTERNAL URLS ==='
          grep -Eo 'https?://[^"<> ]+' /tmp/prime-careers.html | sed 's/&amp;/\&/g' | sort -u | head -n 250 || true
          echo '=== SCRIPT SOURCES ==='
          grep -Eoi '<script[^>]+src=["'"'][^"'"']+' /tmp/prime-careers.html | sed -E 's/.*src=["'"']//I' | sort -u || true
          echo '=== ATS / JOB SOURCE HINTS ==='
          grep -Eoi '.{0,140}(greenhouse|lever|ashby|workable|recruitee|smartrecruiters|jobvite|bamboo|talentreef|teamtailor|workday|comeet|pinpoint|careers-api|job[s]?[-_/ ]?api|critical operations technician).{0,240}' /tmp/prime-careers.html | head -n 120 || true
