name: Priority compensation enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priority-pay-enrichment.yml'
      - 'scripts/enrich-priority-pay.mjs'
      - 'scripts/sanitize-priority-pay-context.mjs'
  workflow_run:
    workflows:
      - 'Refresh jobs and deploy site'
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: priority-compensation-enrichment-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'direct' }}
  cancel-in-progress: true

jobs:
  enrich:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate enrichment scripts
        run: |
          node --check scripts/enrich-priority-pay.mjs
          node --check scripts/sanitize-priority-pay-context.mjs
      - name: Recover employer-listed compensation
        run: node scripts/enrich-priority-pay.mjs
      - name: Reject ambiguous conversion-only compensation
        run: node scripts/sanitize-priority-pay-context.mjs
      - name: Validate public feed after enrichment
        run: |
          node scripts/validate.mjs
          node scripts/validate-priority-employer-sources.mjs
      - name: Commit compensation updates
        id: commit
        run: |
          # collector-status.json records the scan timestamp even when no pay is
          # found. Do not create a main-branch commit for that operational-only
          # timestamp: Pages intentionally deploys product changes, and a
          # status-only commit makes main appear newer than the live site even
          # though the published artifact is unchanged.
          if git diff --quiet -- data/jobs.json; then
            git restore -- data/collector-status.json
            echo "No publishable priority compensation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "jobs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "jobs_changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/collector-status.json
          git commit -m "Refresh employer-listed priority compensation"

          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Could not rebase priority compensation updates onto current main."
            exit 1
          fi
          git push origin HEAD:main
          pushed_sha="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$pushed_sha" >> "$GITHUB_OUTPUT"
      - name: Deploy recovered compensation
        if: steps.commit.outputs.jobs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.pushed_sha }}
        run: |
          set -euo pipefail

          # A GITHUB_TOKEN-authored push does not start a new push workflow, so
          # dispatch Pages explicitly. First wait until the Actions API resolves
          # main to the exact compensation commit we just pushed; otherwise a
          # fast dispatch can build the previous revision and create live drift.
          resolved=false
          remote_sha=''
          for attempt in $(seq 1 15); do
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$remote_sha" = "$EXPECTED_SHA" ]; then
              resolved=true
              break
            fi
            echo "Waiting for GitHub API to resolve main to ${EXPECTED_SHA:0:8} (attempt ${attempt}/15; saw ${remote_sha:0:8})."
            sleep 2
          done

          if [ "$resolved" != true ]; then
            echo "::error::GitHub API did not resolve main to pushed compensation revision $EXPECTED_SHA; refusing to deploy an older revision."
            exit 1
          fi

          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
