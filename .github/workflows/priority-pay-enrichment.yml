name: Priority compensation enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priority-pay-enrichment.yml'
      - 'scripts/enrich-priority-pay.mjs'
  workflow_run:
    workflows:
      - 'Refresh jobs and deploy site'
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: priority-compensation-enrichment-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'direct' }}
  cancel-in-progress: true

jobs:
  enrich:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate enrichment script
        run: node --check scripts/enrich-priority-pay.mjs
      - name: Recover employer-listed compensation
        run: node scripts/enrich-priority-pay.mjs
      - name: Validate public feed after enrichment
        run: |
          node scripts/validate.mjs
          node scripts/validate-priority-employer-sources.mjs
      - name: Commit compensation updates
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/jobs.json data/collector-status.json)" ]; then
            echo "No priority compensation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "jobs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet -- data/jobs.json; then
            echo "jobs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "jobs_changed=true" >> "$GITHUB_OUTPUT"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/collector-status.json
          git commit -m "Refresh employer-listed priority compensation"

          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Could not rebase priority compensation updates onto current main."
            exit 1
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy recovered compensation
        if: steps.commit.outputs.jobs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
