      - 'scripts/validate-major-workday-parity.mjs'
      - 'scripts/validate-major-workday-freshness-state.mjs'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/validate-meta-snapshot.mjs'
      - 'scripts/validate-oracle-snapshot.mjs'
      - 'scripts/validate-google-freshness.mjs'
      - 'scripts/validate-digital-realty.mjs'
      - 'scripts/validate-edgeconnex-snapshot.mjs'
      - 'scripts/validate-coreweave.mjs'
      - 'scripts/validate-cloudhq.mjs'
      - 'scripts/validate-cologix.mjs'
      - 'scripts/validate-t5-data-centers.mjs'
      - 'scripts/validate-iron-mountain.mjs'
      - 'scripts/validate-novva.mjs'
      - 'scripts/validate-databank.mjs'
      - 'scripts/validate-flexential.mjs'
