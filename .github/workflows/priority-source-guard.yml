      - '.github/workflows/pages.yml'
      - '.github/workflows/priority-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify strategic collectors report source health
        run: node scripts/validate-priority-source-diagnostics.mjs
      - name: Verify priority stale-fallback policies before publication
        run: |
          node --check scripts/enforce-amazon-fallback-freshness.mjs
          node --check scripts/enforce-microsoft-fallback-freshness.mjs
          node --check scripts/enforce-meta-fallback-freshness.mjs
          node --check scripts/enforce-oracle-fallback-freshness.mjs
          node --check scripts/enforce-digital-realty-fallback-freshness.mjs
          node --check scripts/enforce-flexential-fallback-freshness.mjs
          node scripts/enforce-amazon-fallback-freshness.mjs --test
          node scripts/enforce-microsoft-fallback-freshness.mjs --test
          node scripts/enforce-meta-fallback-freshness.mjs --test
          node scripts/enforce-oracle-fallback-freshness.mjs --test
          node scripts/enforce-digital-realty-fallback-freshness.mjs --test
          node scripts/enforce-flexential-fallback-freshness.mjs --test
          node scripts/validate-flexential-freshness.mjs
      - name: Verify Microsoft experience classifier before publication
        run: |
          node --check scripts/collect-microsoft-datacenter.mjs
          node scripts/collect-microsoft-datacenter.mjs --test-experience-parser
      - name: Verify DataBank early-career classifier before publication
        run: |
          node --check scripts/collect-databank.mjs
          node --check scripts/validate-databank.mjs
          node scripts/collect-databank.mjs --test-classifier
      - name: Verify comparable operator classifiers before publication
        run: |
          node --check scripts/collect-flexential.mjs
          node --check scripts/collect-switch-careers.mjs
          node --check scripts/collect-cologix.mjs
          node --check scripts/collect-t5-data-centers.mjs
          node scripts/collect-flexential.mjs --test-classifier
          node scripts/collect-switch-careers.mjs --test-classifier
          node scripts/collect-cologix.mjs --test-classifier
          node scripts/collect-t5-data-centers.mjs --test-classifier
      - name: Normalize expired Equinix fallback evidence before source validation
        run: node scripts/enforce-equinix-verified-evidence.mjs
      - name: Verify priority jobs and snapshots stay employer-direct
        run: node scripts/validate-priority-employer-sources.mjs
      - name: Verify priority employers retain authoritative U.S. market coverage
        run: node scripts/validate-priority-region-coverage.mjs
      - name: Verify AWS snapshot identity and public-feed traceability
        run: node scripts/validate-amazon-snapshot.mjs
      - name: Verify major Workday source-health diagnostics
        run: node scripts/validate-major-workday-health.mjs
      - name: Verify major Workday snapshots match the public feed exactly
        run: node scripts/validate-major-workday-parity.mjs
      - name: Verify major Workday source evidence is deployably fresh
        run: node scripts/validate-major-workday-freshness-state.mjs
      - name: Verify CoreSite targeted-listing failover
        run: node scripts/validate-coresite-source-failover.mjs
      - name: Verify Microsoft snapshot and fallback integrity
        run: node scripts/validate-microsoft-snapshot.mjs
      - name: Verify Meta snapshot matches the public feed exactly
        run: node scripts/validate-meta-snapshot.mjs
      - name: Verify Oracle snapshot matches the public feed exactly
        run: node scripts/validate-oracle-snapshot.mjs
      - name: Verify Google fallback freshness before publication
        run: |
          node scripts/validate-google-freshness.mjs --test
          node scripts/validate-google-freshness.mjs
      - name: Verify Equinix fallback evidence and click-routing policies
        run: |
          node --check scripts/apply-equinix-verified-fallback.mjs
          node --check scripts/enforce-equinix-fallback-freshness.mjs
          node --check scripts/enforce-equinix-verified-evidence.mjs
          node --check scripts/promote-equinix-direct-clicks.mjs
          node scripts/enforce-equinix-fallback-freshness.mjs --test
          node scripts/enforce-equinix-verified-evidence.mjs --test
          node scripts/promote-equinix-direct-clicks.mjs --test
      - name: Verify Digital Realty snapshot matches the public feed exactly
        run: node scripts/validate-digital-realty.mjs
      - name: Verify EdgeConneX snapshot and public-feed parity
        run: node scripts/validate-edgeconnex-snapshot.mjs
      - name: Verify CoreWeave snapshot and public-feed opportunity parity
        run: node scripts/validate-coreweave.mjs
      - name: Verify CloudHQ employer-direct snapshot and public-feed traceability
        run: node scripts/validate-cloudhq.mjs
      - name: Verify Cologix and T5 employer-direct snapshots and public-feed parity
        run: |
          node scripts/validate-cologix.mjs
          node scripts/validate-t5-data-centers.mjs
      - name: Verify Iron Mountain employer-direct Workday snapshot and public-feed parity
        run: node scripts/validate-iron-mountain.mjs
      - name: Verify Novva employer-direct snapshot and public-feed parity
        run: node scripts/validate-novva.mjs
      - name: Verify Flexential employer-direct snapshot and freshness
        run: |
          node scripts/validate-flexential.mjs
          node scripts/validate-flexential-freshness.mjs
      - name: Verify Switch employer-direct snapshot and public-feed parity
        run: node scripts/validate-switch-careers.mjs
