      - 'data/*-jobs.json'
      - 'scripts/collect-*.mjs'
      - 'scripts/recover-*.mjs'
      - 'scripts/apply-*-verified-fallback.mjs'
      - 'scripts/persist-*-snapshot.mjs'
      - 'scripts/reconcile-major-jobs.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/filter-mission-fit.mjs'
