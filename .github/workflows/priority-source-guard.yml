name: Priority employer source guard

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/*-jobs.json'
      - 'scripts/collect-*.mjs'
      - 'scripts/recover-*.mjs'
      - 'scripts/apply-*-verified-fallback.mjs'
      - 'scripts/persist-*-snapshot.mjs'
      - 'scripts/reconcile-major-jobs.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/validate-priority-employer-sources.mjs'
      - 'scripts/validate-major-workday-parity.mjs'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/validate-meta-snapshot.mjs'
      - 'scripts/validate-oracle-snapshot.mjs'
      - 'scripts/validate-digital-realty.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/priority-source-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/*-jobs.json'
      - 'scripts/collect-*.mjs'
      - 'scripts/recover-*.mjs'
      - 'scripts/apply-*-verified-fallback.mjs'
      - 'scripts/persist-*-snapshot.mjs'
      - 'scripts/reconcile-major-jobs.mjs'
      - 'scripts/dedupe-normalized-jobs.mjs'
      - 'scripts/filter-mission-fit.mjs'
      - 'scripts/validate-priority-employer-sources.mjs'
      - 'scripts/validate-major-workday-parity.mjs'
      - 'scripts/validate-microsoft-snapshot.mjs'
      - 'scripts/validate-meta-snapshot.mjs'
      - 'scripts/validate-oracle-snapshot.mjs'
      - 'scripts/validate-digital-realty.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/priority-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify priority jobs and snapshots stay employer-direct
        run: node scripts/validate-priority-employer-sources.mjs
      - name: Verify major Workday snapshots match the public feed exactly
        run: node scripts/validate-major-workday-parity.mjs
      - name: Verify Microsoft snapshot and fallback integrity
        run: node scripts/validate-microsoft-snapshot.mjs
      - name: Verify Meta snapshot matches the public feed exactly
        run: node scripts/validate-meta-snapshot.mjs
      - name: Verify Oracle snapshot matches the public feed exactly
        run: node scripts/validate-oracle-snapshot.mjs
      - name: Verify Digital Realty snapshot matches the public feed exactly
        run: node scripts/validate-digital-realty.mjs
