name: Promotion admin guard

on:
  pull_request:
    paths:
      - 'scripts/manage-promotion.mjs'
      - 'scripts/validate-promotions.mjs'
      - 'scripts/test-promotion-runtime-contract.mjs'
      - 'data/employer-products.json'
      - 'data/featured-jobs.json'
      - '.github/workflows/promotion-admin.yml'
      - '.github/workflows/promotion-admin-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/manage-promotion.mjs'
      - 'scripts/validate-promotions.mjs'
      - 'scripts/test-promotion-runtime-contract.mjs'
      - 'data/employer-products.json'
      - 'data/featured-jobs.json'
      - '.github/workflows/promotion-admin.yml'
      - '.github/workflows/promotion-admin-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate promotion admin safety contract
        run: |
          node --check scripts/manage-promotion.mjs
          node scripts/manage-promotion.mjs --self-test
          node scripts/validate-promotions.mjs
          node scripts/test-promotion-runtime-contract.mjs
