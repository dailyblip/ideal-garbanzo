name: Employer promotion admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Promotion action'
        required: true
        type: choice
        options:
          - activate
          - replace
          - deactivate
      job_id:
        description: 'Exact verified job id from data/jobs.json'
        required: true
        type: string
      tier:
        description: 'Paid placement tier (ignored for deactivate)'
        required: true
        default: highlightedJob
        type: choice
        options:
          - highlightedJob
          - spotlightJob

permissions:
  contents: write

concurrency:
  group: employer-promotion-admin
  cancel-in-progress: false

jobs:
  update-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate promotion admin and current publication state
        run: |
          node --check scripts/manage-promotion.mjs
          node scripts/manage-promotion.mjs --self-test
          node scripts/validate.mjs
          node scripts/validate-direct-role-links.mjs
          node scripts/validate-promotions.mjs
          node scripts/test-promotion-runtime-contract.mjs
      - name: Apply requested promotion change
        env:
          PROMOTION_ACTION: ${{ inputs.action }}
          PROMOTION_JOB_ID: ${{ inputs.job_id }}
          PROMOTION_TIER: ${{ inputs.tier }}
        run: node scripts/manage-promotion.mjs
      - name: Validate resulting promotion state
        run: |
          node scripts/validate-promotions.mjs
          node scripts/test-promotion-runtime-contract.mjs
      - name: Commit promotion state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/featured-jobs.json; then
            echo "::error::Promotion request produced no state change."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/featured-jobs.json
          git commit -m "Update employer promotion for ${{ inputs.job_id }}"

          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Main changed promotion state concurrently; review the current featured-jobs.json before retrying."
            exit 1
          fi

          node scripts/validate-promotions.mjs
          node scripts/test-promotion-runtime-contract.mjs
          git push origin HEAD:main
