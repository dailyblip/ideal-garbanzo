name: Promotion lifecycle hygiene

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/featured-jobs.json'
      - 'data/employer-products.json'
      - 'employers/index.html'
      - 'assets/employer-inquiry.js'
      - 'scripts/prune-promotions.mjs'
      - 'scripts/validate-promotions.mjs'
      - '.github/workflows/promotion-lifecycle.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: promotion-lifecycle
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate promotion lifecycle scripts
        run: |
          node --check scripts/prune-promotions.mjs
          node --check scripts/validate-promotions.mjs
      - name: Remove expired and orphaned promotion activations
        run: node scripts/prune-promotions.mjs
      - name: Validate employer promotion products and live activations
        run: node scripts/validate-promotions.mjs
      - name: Commit lifecycle cleanup when needed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Employer/source refreshes write main frequently. Rebuild this generated
          # cleanup from the newest main revision before every push attempt rather
          # than rebasing a stale featured-jobs diff across a moving jobs feed.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/prune-promotions.mjs
            node scripts/validate-promotions.mjs

            if git diff --quiet -- data/featured-jobs.json; then
              echo "No stale promotion activations to remove."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add data/featured-jobs.json
            git commit -m "Prune stale promotion activations"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during promotion cleanup publish attempt ${attempt}; rebuilding from latest main."
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish promotion lifecycle cleanup after three attempts."
          exit 1
      - name: Deploy promotion cleanup
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
