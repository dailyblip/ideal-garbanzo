name: Repair Oracle collector isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-oracle-isolation.yml'

permissions:
  contents: write

concurrency:
  group: oracle-isolation-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restrict Oracle cleanup to Oracle-owned records
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/collect-oracle-careers.mjs';
          const source = await readFile(path, 'utf8');
          const replacement = 'const withoutOracle = currentJobs.filter(job => job.company !== COMPANY);';
          const next = source.replace(/^const withoutOracle = currentJobs\.filter\(job => .*$/m, replacement);
          if (next === source && !source.includes(replacement)) {
            throw new Error('Could not locate Oracle ownership filter to repair.');
          }
          if (next !== source) await writeFile(path, next);
          NODE
      - name: Restore official Digital Realty snapshot
        run: node scripts/collect-digital-realty.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate repaired feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-oracle-isolation.yml
          git add scripts/collect-oracle-careers.mjs data/digital-realty-jobs.json data/jobs.json data/job-history.json data/collector-status.json
          git commit -m "Isolate Oracle cleanup and restore Digital Realty roles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
