name: Revert redundant CyrusOne collector

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-cyrusone-once.yml

permissions:
  contents: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore major Workday source ownership
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The dedicated CyrusOne refresh duplicated an employer already owned by
          # the reconciled major Workday pipeline. Revert only its generated data.
          git revert --no-edit 2f13a6975344c692ac6cd07ea408ff232138800d

          # Remove the redundant collector, validator, schedule, and this one-time
          # cleanup workflow. CyrusOne remains covered by collect-major-jobs.mjs.
          git rm scripts/collect-cyrusone-careers.mjs \
                 scripts/validate-cyrusone.mjs \
                 .github/workflows/cyrusone-bootstrap.yml \
                 .github/workflows/revert-cyrusone-once.yml
          git commit -m "Remove redundant CyrusOne collector experiment"
          git push origin HEAD:main
