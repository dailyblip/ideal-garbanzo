name: One-shot full refresh dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-full-refresh-once.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full production refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Omit deploy_only so the typed workflow input uses its boolean false default.
          # Passing false through gh -F can serialize incompatibly and skip refresh.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

# Trigger a full refresh after the clear U.S. multi-location Workday reconciliation fix.
