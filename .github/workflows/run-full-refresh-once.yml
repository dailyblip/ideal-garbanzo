name: One-shot full refresh dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-full-refresh-once.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full production refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use --field so the typed workflow input is sent as boolean false.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -F deploy_only=false
