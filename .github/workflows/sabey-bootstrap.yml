name: Refresh Sabey employer-direct feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-sabey-careers.mjs'
      - 'scripts/persist-sabey-snapshot.mjs'
      - '.github/workflows/sabey-bootstrap.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: sabey-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard Sabey experience classification
        run: node scripts/collect-sabey-careers.mjs --test-experience-parser
      - name: Collect official Sabey roles
        run: node scripts/collect-sabey-careers.mjs
      - name: Persist Sabey source snapshot
        run: node scripts/persist-sabey-snapshot.mjs
      - name: Enforce mission-fit roles
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate feed and source integrity
        run: |
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate.mjs
      - name: Commit verified Sabey snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-sabey-careers.mjs
            node scripts/persist-sabey-snapshot.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate.mjs
          }

          # Shared feed data can move while this source is being verified. Always
          # rebuild from the newest main snapshot instead of rebasing two generated
          # jobs.json versions, which can conflict or discard another source update.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during Sabey refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/sabey-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No Sabey data or job-history changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified Sabey jobs and history"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during Sabey publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified Sabey data after three attempts."
          exit 1
      - name: Deploy committed Sabey data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
