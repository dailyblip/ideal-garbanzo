name: Refresh Sabey employer-direct feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect-sabey-careers.mjs'
      - 'scripts/persist-sabey-snapshot.mjs'
      - '.github/workflows/sabey-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: sabey-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard Sabey experience classification
        run: node scripts/collect-sabey-careers.mjs --test-experience-parser
      - name: Collect official Sabey roles
        run: node scripts/collect-sabey-careers.mjs
      - name: Persist Sabey source snapshot
        run: node scripts/persist-sabey-snapshot.mjs
      - name: Enforce mission-fit roles
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate feed and source integrity
        run: |
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate.mjs
      - name: Commit verified Sabey snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/jobs.json data/sabey-jobs.json data/job-history.json data/collector-status.json)" ]; then
            echo "No Sabey data or job-history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/sabey-jobs.json data/job-history.json data/collector-status.json
          git commit -m "Refresh verified Sabey jobs and history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
