name: Site contract guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate early-career ingestion classifiers
        run: |
          node scripts/collect-jobs-core.mjs --test-experience-parser
          node scripts/collect-flexential.mjs --test-classifier
          node scripts/collect-major-jobs.mjs --test-experience-parser
          node scripts/collect-switch-careers.mjs --test-classifier
      - name: Validate Switch employer-direct source contract
        run: node scripts/validate-switch-careers.mjs
      - name: Validate Cologix employer-direct source contract
        run: |
          node scripts/validate-cologix.mjs --test
          node scripts/validate-cologix.mjs
      - name: Validate CloudHQ employer-direct source contract
        run: node scripts/validate-cloudhq.mjs
      - name: Validate DataBank employer-direct source contract
        run: |
          node scripts/validate-databank.mjs --test
          node scripts/validate-databank.mjs
      - name: Validate Compass employer-direct source contract
        run: |
          node scripts/persist-compass-status.mjs --test-freshness
          node scripts/validate-compass-datacenters.mjs --test
          node scripts/validate-compass-datacenters.mjs
      - name: Validate Stream Data Centers employer-direct source contract
        run: |
          node scripts/collect-stream-data-centers.mjs --test-classifier
          node scripts/validate-stream-data-centers.mjs --test
          node scripts/validate-stream-data-centers.mjs
      - name: Validate EdgeConneX employer-direct source contract
        run: |
          node scripts/enforce-edgeconnex-fallback-freshness.mjs --test
          node scripts/validate-edgeconnex.mjs --test
          node scripts/enforce-edgeconnex-fallback-freshness.mjs --check
          node scripts/validate-edgeconnex.mjs
      - name: Validate regional filtering and publication geography contracts
        run: |
          node scripts/test-region-filter-contract.mjs
          node scripts/prune-unresolved-geography.mjs --test
      - name: Validate weekly alert plumbing and employer diversity
        run: |
          node scripts/validate-mailing-list.mjs
          node scripts/validate-alert-signup-parity.mjs
          node scripts/validate-alert-job-detail-parity.mjs
          node scripts/send-weekly-job-alert.mjs --test-selection
      - name: Validate verified career-event contract
        run: |
          node scripts/test-career-event-evidence.mjs
          node scripts/validate-career-event-freshness.mjs
      - name: Validate promotion runtime contract
        run: node scripts/test-promotion-runtime-contract.mjs
      - name: Validate employer promotion and inquiry contract
        run: |
          node scripts/validate-promotions.mjs
          node scripts/validate-employer-submissions.mjs
      - name: Validate jobs search and filter contract
        run: node scripts/validate-jobs-browser.mjs
      - name: Validate jobs visual QA harness syntax
        run: node --check scripts/visual-jobs-page-qa.mjs
      - name: Validate approved homepage contract
        run: node scripts/validate-homepage-contract.mjs
      - name: Validate authored-page accessibility
        run: node scripts/validate-accessibility.mjs
      - name: Validate source workflow isolation
        run: |
          node scripts/validate-source-workflow-isolation.mjs
          node scripts/validate-stale-prune-isolation.mjs
      - name: Validate time-bounded Equinix fallback state
        run: |
          node scripts/enforce-equinix-verified-evidence.mjs --test
          node scripts/enforce-equinix-verified-evidence.mjs
          git diff --exit-code -- data/jobs.json data/collector-status.json
      - name: Validate priority employer publication integrity
        run: |
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-direct-role-links.mjs
          node scripts/validate-major-workday-parity.mjs
      - name: Validate CoreSite official listing failover
        run: node scripts/validate-coresite-source-failover.mjs
      - name: Validate CoreSite source integrity
        run: |
          node scripts/validate-coresite-source-integrity.mjs --test
          node scripts/validate-coresite-source-integrity.mjs
          node scripts/validate-coresite-fallback.mjs
      - name: Validate plain-language site copy
        run: node scripts/validate-site-copy.mjs
      - name: Generate search and discovery landing pages for contract validation
        run: |
          node scripts/generate-seo.mjs
          node scripts/generate-region-seo.mjs
          node scripts/generate-company-seo.mjs
      - name: Build apprenticeship page in homepage visual system
        run: node scripts/enhance-apprenticeship-page.mjs
      - name: Validate generated-page copy and accessibility
        run: node scripts/validate-site-copy.mjs
      - name: Validate search landing contract
        run: node scripts/validate-search-landings.mjs
      - name: Validate region and employer discovery landings
        run: node scripts/validate-discovery-landings.mjs
      - name: Validate apprenticeship visual and functional contract
        run: node scripts/validate-apprenticeship-landing.mjs
