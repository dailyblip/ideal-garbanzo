name: Site contract guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate early-career ingestion classifiers
        run: |
          node scripts/collect-jobs-core.mjs --test-experience-parser
          node scripts/collect-flexential.mjs --test-classifier
          node scripts/collect-major-jobs.mjs --test-experience-parser
          node scripts/collect-switch-careers.mjs --test-classifier
      - name: Validate Switch employer-direct source contract
        run: node scripts/validate-switch-careers.mjs
      - name: Validate regional filtering contract
        run: node scripts/test-region-filter-contract.mjs
      - name: Validate promotion runtime contract
        run: node scripts/test-promotion-runtime-contract.mjs
      - name: Validate employer promotion and inquiry contract
        run: node scripts/validate-promotions.mjs
      - name: Validate jobs search and filter contract
        run: node scripts/validate-jobs-browser.mjs
      - name: Validate approved homepage contract
        run: node scripts/validate-homepage-contract.mjs
      - name: Validate authored-page accessibility
        run: node scripts/validate-accessibility.mjs
      - name: Validate source workflow isolation
        run: node scripts/validate-source-workflow-isolation.mjs
      - name: Validate CoreSite official listing failover
        run: node scripts/validate-coresite-source-failover.mjs
      - name: Validate plain-language site copy
        run: node scripts/validate-site-copy.mjs
      - name: Generate search landing pages for contract validation
        run: node scripts/generate-seo.mjs
      - name: Build apprenticeship page in homepage visual system
        run: node scripts/enhance-apprenticeship-page.mjs
      - name: Validate search landing contract
        run: node scripts/validate-search-landings.mjs
      - name: Validate apprenticeship visual and functional contract
        run: node scripts/validate-apprenticeship-landing.mjs
