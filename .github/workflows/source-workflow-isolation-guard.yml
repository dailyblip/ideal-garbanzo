name: Source workflow isolation guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history-group.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/validate-source-workflow-isolation.mjs'
      - 'scripts/preserve-source-group.mjs'
      - 'scripts/stamp-job-history-group.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source workflow trigger isolation
        run: node scripts/validate-source-workflow-isolation.mjs
      - name: Validate source-group isolation helpers
        run: |
          node --check scripts/preserve-source-group.mjs
          node --check scripts/stamp-job-history-group.mjs
          node scripts/preserve-source-group.mjs --test
          node scripts/stamp-job-history-group.mjs --test
