name: Steward incident hygiene

on:
  workflow_run:
    workflows: ["Refresh jobs and deploy site"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: steward-incident-hygiene
  cancel-in-progress: true

jobs:
  close-superseded-incidents:
    runs-on: ubuntu-latest
    steps:
      - name: Close incidents superseded by a healthy pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Always reconcile against the newest successful deployment on main.
          # Do not trust the triggering workflow_run alone: rapid refreshes can
          # cancel/supersede one another, and workflow_run events can therefore
          # arrive out of order or with a non-success conclusion.
          current_run="$(gh api "repos/${REPO}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"

          if [ -z "$current_run" ]; then
            echo "No successful refresh/deploy run is available; leaving incidents open."
            exit 0
          fi

          closed=0
          while IFS=$'\t' read -r number title; do
            [ -z "$number" ] && continue
            if [[ "$title" =~ ^\[Steward\]\ (Pipeline\ incident|Stuck\ pipeline)\ -\ run\ ([0-9]+)$ ]]; then
              incident_run="${BASH_REMATCH[2]}"
              if [ "$incident_run" -lt "$current_run" ]; then
                gh issue comment "$number" --repo "$REPO" --body "Recovered: a newer refresh/deploy pipeline run (${current_run}) completed successfully, so this older incident is superseded."
                gh issue close "$number" --repo "$REPO" --reason completed
                closed=$((closed + 1))
              fi
            fi
          done < <(
            gh issue list --repo "$REPO" --state open --limit 100 --json number,title --jq '.[] | [.number,.title] | @tsv'
          )

          # Deployment-drift incidents require stronger evidence than a green
          # workflow. Close them only when the live deployment marker is the
          # current main SHA and the approved homepage copy is actually live.
          drift_numbers="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[Steward] Deployment drift") | .number')"

          if [ -n "$drift_numbers" ]; then
            live_marker="$(curl -fsSL --max-time 15 "https://datacentercareers.us/deployment-version.json?hygiene=${current_run}" 2>/dev/null || true)"
            live_sha="$(printf '%s' "$live_marker" | jq -r '.sha // empty' 2>/dev/null || true)"
            homepage="$(curl -fsSL --max-time 15 "https://datacentercareers.us/?hygiene=${current_run}" 2>/dev/null || true)"
            homepage_text="$(printf '%s' "$homepage" | sed -E 's/<[^>]+>/ /g; s/&nbsp;/ /g' | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
            homepage_ok=false
            if printf '%s' "$homepage_text" | grep -Fq 'Build your future in data centers.' \
              && printf '%s' "$homepage_text" | grep -Fq 'SKILLED WORK · MODERN INFRASTRUCTURE · REAL OPPORTUNITY' \
              && printf '%s' "$homepage_text" | grep -Fq 'Real openings for interns, apprentices, first-time applicants and workers ready for their next step.'; then
              homepage_ok=true
            fi

            # Read main after the live marker, matching the primary steward's
            # race-safe comparison order.
            main_sha="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
            if [ "$live_sha" = "$main_sha" ] && [ "$homepage_ok" = "true" ]; then
              while IFS= read -r number; do
                [ -z "$number" ] && continue
                gh issue comment "$number" --repo "$REPO" --body "Auto-closing stale deployment drift incident. The live deployment marker and approved homepage contract now match main at ${main_sha}."
                gh issue close "$number" --repo "$REPO" --reason completed
                closed=$((closed + 1))
              done <<< "$drift_numbers"
            else
              echo "Deployment drift remains unresolved: live=${live_sha:-missing}, main=${main_sha}, homepage_ok=${homepage_ok}."
            fi
          fi

          echo "Closed ${closed} superseded/recovered steward incident issue(s) after successful pipeline run ${current_run}."
