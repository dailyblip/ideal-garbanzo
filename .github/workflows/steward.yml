name: Pipeline steward

on:
  workflow_run:
    workflows: ["Refresh jobs and deploy site"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: pipeline-steward
  cancel-in-progress: false

env:
  SITE_URL: https://datacentercareers.us
  TARGET_WORKFLOW: pages.yml
  STUCK_AFTER_MINUTES: '45'

jobs:
  completed-run:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect, recover, and verify completed pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail

          find_open_issue() {
            local title="$1"
            gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1
          }

          close_issue() {
            local title="$1"
            local note="$2"
            local number
            number="$(find_open_issue "$title")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body "$note"
              gh issue close "$number" --repo "$REPO" --reason completed
            fi
          }

          open_or_comment_issue() {
            local title="$1"
            local body_file="$2"
            local number
            number="$(find_open_issue "$title")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body-file "$body_file"
            else
              gh issue create --repo "$REPO" --title "$title" --body-file "$body_file"
            fi
          }

          pipeline_title="[Steward] Pipeline incident - run ${RUN_ID}"
          domain_blocker_title="[Steward] Custom-domain deployment blocker"
          stuck_title="[Steward] Stuck pipeline - run ${RUN_ID}"

          newer_run="$(gh api "repos/${REPO}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=20" \
            --jq ".workflow_runs[] | select(.id > ${RUN_ID}) | .id" | head -n 1)"
          if [ -n "$newer_run" ]; then
            {
              echo "## Pipeline steward"
              echo
              echo "Run ${RUN_ID} has been superseded by newer run ${newer_run}. Steward recovery and deployment verification are deferred to the newer run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RUN_CONCLUSION" = "skipped" ]; then
            echo "Run ${RUN_ID} was skipped; no steward action is required."
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "success" ]; then
            attempt="${RUN_ATTEMPT:-1}"
            if [ "$attempt" -lt 2 ]; then
              echo "Pipeline run ${RUN_ID} ended ${RUN_CONCLUSION} on attempt ${attempt}; steward is retrying once."
              retry_ok=false
              if [ "$RUN_CONCLUSION" = "cancelled" ]; then
                if gh run rerun "$RUN_ID" --repo "$REPO"; then retry_ok=true; fi
              else
                if gh run rerun "$RUN_ID" --repo "$REPO" --failed; then retry_ok=true; fi
              fi
              if [ "$retry_ok" = "true" ]; then
                {
                  echo "## Pipeline steward"
                  echo
                  echo "Run ${RUN_ID} ended ${RUN_CONCLUSION} on attempt ${attempt}. The steward automatically queued one retry."
                  echo "$RUN_URL"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            gh run view "$RUN_ID" --repo "$REPO" --json jobs \
              --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- \(.name): \(.conclusion)"' \
              > /tmp/failed-jobs.txt 2>/dev/null || true
            gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1 | tail -n 180 > /tmp/failed-log.txt || true

            if grep -Fq 'Verify custom-domain deployment' /tmp/failed-log.txt; then
              pipeline_title="$domain_blocker_title"
            fi

            {
              echo "The Data Center Careers refresh/deploy pipeline needs intervention."
              echo
              echo "- Run: ${RUN_URL}"
              echo "- Conclusion: ${RUN_CONCLUSION}"
              echo "- Attempt: ${RUN_ATTEMPT:-unknown}"
              echo "- Automatic retry: exhausted or could not be started"
              echo
              echo "### Failed jobs"
              if [ -s /tmp/failed-jobs.txt ]; then cat /tmp/failed-jobs.txt; else echo "GitHub did not return a failed-job summary."; fi
              echo
              echo "### Failed log excerpt"
              echo '```text'
              if [ -s /tmp/failed-log.txt ]; then cat /tmp/failed-log.txt; else echo "No failed log excerpt was available."; fi
              echo '```'
              echo
              echo "### Steward request"
              echo "Inspect the failed step and logs, make the smallest safe correction, rerun validation, and confirm the live deployment before closing this incident."
            } > /tmp/incident.md
            open_or_comment_issue "$pipeline_title" /tmp/incident.md
            exit 0
          fi

          close_issue "$pipeline_title" "Recovered: pipeline run ${RUN_ID} completed successfully."
          close_issue "$domain_blocker_title" "Recovered: custom-domain verification passed in pipeline run ${RUN_ID}."
          close_issue "$stuck_title" "Recovered: pipeline run ${RUN_ID} completed successfully."
          main_sha=""
          live_sha=""
          homepage_ok="false"

          for attempt in $(seq 1 12); do
            marker="$(curl -fsSL --max-time 15 "${SITE_URL}/deployment-version.json?run=${RUN_ID}-${attempt}" 2>/dev/null || true)"
            live_sha="$(printf '%s' "$marker" | jq -r '.sha // empty' 2>/dev/null || true)"
            homepage="$(curl -fsSL --max-time 15 "${SITE_URL}/?run=${RUN_ID}-${attempt}" 2>/dev/null || true)"
            homepage_text="$(printf '%s' "$homepage" | sed -E 's/<[^>]+>/ /g; s/&nbsp;/ /g' | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
            if printf '%s' "$homepage_text" | grep -Fq 'Build your future in data centers.' \
              && printf '%s' "$homepage_text" | grep -Fq 'SKILLED WORK · MODERN INFRASTRUCTURE · REAL OPPORTUNITY' \
              && printf '%s' "$homepage_text" | grep -Fq 'Real openings for interns, apprentices, first-time applicants and workers ready for their next step.'; then
              homepage_ok="true"
            else
              homepage_ok="false"
            fi
            # Read main after the live marker so a newer push cannot make a
            # freshly deployed revision look like drift against a stale SHA.
            main_sha="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
            if [ "$live_sha" = "$main_sha" ] && [ "$homepage_ok" = "true" ]; then
              break
            fi
            sleep 10
          done

          drift_title="[Steward] Deployment drift"
          if [ "$live_sha" != "$main_sha" ] || [ "$homepage_ok" != "true" ]; then
            {
              echo "The GitHub workflow reported success, but the live Pages deployment did not verify as the current main revision."
              echo
              echo "- Completed run: ${RUN_URL}"
              echo "- Current main SHA: \`${main_sha}\`"
              echo "- Live deployment SHA: \`${live_sha:-missing}\`"
              echo "- Homepage contract marker found: ${homepage_ok}"
              echo "- Site: ${SITE_URL}/"
              echo
              echo "The steward retried live verification before opening this incident. Inspect GitHub Pages/deployment state and redeploy the current main revision if needed."
            } > /tmp/drift.md
            open_or_comment_issue "$drift_title" /tmp/drift.md
          else
            close_issue "$drift_title" "Recovered: live deployment now matches main at ${main_sha}."
            {
              echo "## Pipeline steward"
              echo
              echo "Pipeline succeeded and the live deployment matches main at \`${main_sha}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  active-run-watchdog:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Watch active jobs and deployment drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          find_open_issue() {
            local title="$1"
            gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1
          }

          open_or_comment_issue() {
            local title="$1"
            local body_file="$2"
            local number
            number="$(find_open_issue "$title")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body-file "$body_file"
            else
              gh issue create --repo "$REPO" --title "$title" --body-file "$body_file"
            fi
          }

          close_issue() {
            local title="$1"
            local note="$2"
            local number
            number="$(find_open_issue "$title")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body "$note"
              gh issue close "$number" --repo "$REPO" --reason completed
            fi
          }

          now="$(date -u +%s)"
          active_count=0
          while IFS=$'\t' read -r run_id status started created run_url; do
            [ -z "$run_id" ] && continue
            active_count=$((active_count + 1))
            timestamp="${started:-$created}"
            started_epoch="$(date -u -d "$timestamp" +%s 2>/dev/null || echo "$now")"
            age_minutes=$(( (now - started_epoch) / 60 ))
            if [ "$age_minutes" -ge "$STUCK_AFTER_MINUTES" ]; then
              title="[Steward] Stuck pipeline - run ${run_id}"
              {
                echo "A Data Center Careers workflow has remained ${status} longer than the normal stewardship threshold."
                echo
                echo "- Run: ${run_url}"
                echo "- Status: ${status}"
                echo "- Age: ${age_minutes} minutes"
                echo "- Threshold: ${STUCK_AFTER_MINUTES} minutes"
                echo
                echo "Inspect the active job before cancelling or rerunning it; avoid creating a second concurrent refresh."
              } > /tmp/stuck.md
              open_or_comment_issue "$title" /tmp/stuck.md
            fi
          done < <(
            gh api "repos/${REPO}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=20" \
              --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | [.id,.status,(.run_started_at // ""),.created_at,.html_url] | @tsv'
          )

          if [ "$active_count" -eq 0 ]; then
            marker="$(curl -fsSL --max-time 15 "${SITE_URL}/deployment-version.json?watch=${now}" 2>/dev/null || true)"
            live_sha="$(printf '%s' "$marker" | jq -r '.sha // empty' 2>/dev/null || true)"
            # Read main after the live marker for the same reason as the
            # completed-run verifier: avoid false drift during a concurrent push.
            main_sha="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
            drift_title="[Steward] Deployment drift"

            if [ -n "$live_sha" ] && [ "$live_sha" != "$main_sha" ]; then
              {
                echo "No refresh/deploy workflow is active, but the live Pages revision does not match main."
                echo
                echo "- Current main SHA: \`${main_sha}\`"
                echo "- Live deployment SHA: \`${live_sha}\`"
                echo "- Site: ${SITE_URL}/"
                echo
                echo "Inspect the most recent Pages deployment and redeploy current main if the mismatch persists."
              } > /tmp/scheduled-drift.md
              open_or_comment_issue "$drift_title" /tmp/scheduled-drift.md
            elif [ "$live_sha" = "$main_sha" ]; then
              close_issue "$drift_title" "Recovered: scheduled verification confirms live Pages matches main at ${main_sha}."
            fi
          fi
