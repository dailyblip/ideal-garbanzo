name: Bootstrap T5 Data Centers roles

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-t5-data-centers.mjs
      - scripts/validate-t5-data-centers.mjs
      - .github/workflows/t5-data-centers-bootstrap.yml
  workflow_dispatch:
  schedule:
    - cron: '2 1,13 * * *'

permissions:
  contents: write
  actions: write

# Scheduled feed writers share this queue. T5 no longer retriggers on every
# data/jobs.json update, which prevents source-update cascades.
concurrency:
  group: careers-source-writers
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Refresh verified T5 Data Centers roles'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector and classifier
        run: |
          node --check scripts/collect-t5-data-centers.mjs
          node --check scripts/validate-t5-data-centers.mjs
          node scripts/collect-t5-data-centers.mjs --test-classifier
      - name: Collect official T5 Lever roles
        run: node scripts/collect-t5-data-centers.mjs
      - name: Enforce mission-fit role families
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations and regions
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate normalized jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Refresh regional coverage
        run: node scripts/refresh-region-status.mjs
      - name: Validate T5 employer-direct snapshot
        run: node scripts/validate-t5-data-centers.mjs
      - name: Track first-seen dates
        run: node scripts/stamp-job-history.mjs
      - name: Validate updated feed
        run: |
          node scripts/validate.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate-homepage-contract.mjs
      - name: Publish verified T5 roles from current main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-t5-data-centers.mjs --test-classifier
            node scripts/collect-t5-data-centers.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/refresh-region-status.mjs
            node scripts/validate-t5-data-centers.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate-homepage-contract.mjs
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during T5 refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/major-jobs.json data/t5-data-centers-jobs.json data/job-history.json data/collector-status.json
            if git diff --cached --quiet; then
              echo "No verified T5 Data Centers data changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified T5 Data Centers roles"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during T5 publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified T5 Data Centers data after three fresh-main rebuilds."
          exit 1
      - name: Deploy committed T5 data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true
