name: Refresh TierPoint employer-direct feed

on:
  workflow_dispatch:
  schedule:
    - cron: '55 12 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-tierpoint-v3.mjs'
      - 'scripts/stamp-job-history.mjs'
      - 'scripts/validate-job-history.mjs'
      - '.github/workflows/tierpoint-bootstrap.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: careers-source-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official TierPoint roles
        run: node scripts/collect-tierpoint-v3.mjs
      - name: Enforce mission-fit roles
        run: node scripts/filter-mission-fit.mjs
      - name: Normalize locations
        run: node scripts/normalize-job-locations.mjs
      - name: Deduplicate jobs
        run: node scripts/dedupe-normalized-jobs.mjs
      - name: Persist first-seen dates for weekly alerts
        run: node scripts/stamp-job-history.mjs
      - name: Validate feed and alert history
        run: |
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-job-history.mjs
          node scripts/validate.mjs
      - name: Commit verified TierPoint snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            node scripts/collect-tierpoint-v3.mjs
            node scripts/filter-mission-fit.mjs
            node scripts/normalize-job-locations.mjs
            node scripts/dedupe-normalized-jobs.mjs
            node scripts/stamp-job-history.mjs
            node scripts/validate-priority-employer-sources.mjs
            node scripts/validate-job-history.mjs
            node scripts/validate.mjs
          }

          # Another employer/source guard can legitimately update the shared job
          # feed while this workflow is running. Rebuild from that newer main
          # instead of rebasing two independently generated JSON snapshots, which
          # can create avoidable conflicts or drop the newer source state.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during TierPoint refresh; rebuilding from latest main."
            rebuild_from_latest_main
          fi

          for attempt in 1 2 3; do
            git add data/jobs.json data/tierpoint-jobs.json data/job-history.json data/collector-status.json data/major-jobs.json
            if git diff --cached --quiet; then
              echo "No TierPoint data or job-history changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh verified TierPoint jobs and history"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main moved during TierPoint publish attempt ${attempt}; rebuilding before retry."
            sleep $((attempt * 2))
            rebuild_from_latest_main
          done

          echo "::error::Could not publish verified TierPoint data after three attempts."
          exit 1
      - name: Deploy committed TierPoint data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_only=true