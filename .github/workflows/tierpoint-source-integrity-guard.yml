name: TierPoint source integrity guard

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/tierpoint-jobs.json'
      - 'data/collector-status.json'
      - 'scripts/collect-tierpoint-v3.mjs'
      - 'scripts/validate-tierpoint-snapshot.mjs'
      - '.github/workflows/tierpoint-bootstrap.yml'
      - '.github/workflows/tierpoint-source-integrity-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/tierpoint-jobs.json'
      - 'data/collector-status.json'
      - 'scripts/collect-tierpoint-v3.mjs'
      - 'scripts/validate-tierpoint-snapshot.mjs'
      - '.github/workflows/tierpoint-bootstrap.yml'
      - '.github/workflows/tierpoint-source-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check TierPoint source scripts
        run: |
          node --check scripts/collect-tierpoint-v3.mjs
          node --check scripts/validate-tierpoint-snapshot.mjs
      - name: Verify TierPoint official snapshot and public-feed parity
        run: node scripts/validate-tierpoint-snapshot.mjs
      - name: Verify employer-direct publication and homepage contract
        run: |
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-homepage-contract.mjs
