name: Monday weekly job digest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/send-weekly-digest.mjs'
      - 'scripts/validate-mailing-list.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'data/mailing-list.json'
      - '.github/workflows/weekly-digest.yml'
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the digest in workflow logs without sending'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: monday-weekly-job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate weekly mailing configuration
        run: node scripts/validate-mailing-list.mjs
      - name: Validate persisted first-seen job history
        run: node scripts/validate-job-history.mjs
      - name: Validate weekly digest script
        run: node --check scripts/send-weekly-digest.mjs
      - name: Preflight current digest content
        env:
          DRY_RUN: true
        run: node scripts/send-weekly-digest.mjs
      - name: Build and send Monday roundup
        if: github.event_name != 'push'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/send-weekly-digest.mjs
