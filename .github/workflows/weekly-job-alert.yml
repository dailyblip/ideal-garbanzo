name: Weekly job alert

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/mailing-list.js'
      - 'assets/jobs-listing.js'
      - 'scripts/send-weekly-job-alert.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/validate-mailing-list.mjs'
      - 'scripts/validate-alert-signup-parity.mjs'
      - 'scripts/validate-alert-job-detail-parity.mjs'
      - 'scripts/validate-priority-employer-sources.mjs'
      - 'scripts/validate-direct-role-links.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/generate-seo.mjs'
      - 'data/jobs.json'
      - 'data/mailing-list.json'
      - '.github/workflows/weekly-job-alert.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/mailing-list.js'
      - 'assets/jobs-listing.js'
      - 'scripts/send-weekly-job-alert.mjs'
      - 'scripts/validate.mjs'
      - 'scripts/validate-mailing-list.mjs'
      - 'scripts/validate-alert-signup-parity.mjs'
      - 'scripts/validate-alert-job-detail-parity.mjs'
      - 'scripts/validate-priority-employer-sources.mjs'
      - 'scripts/validate-direct-role-links.mjs'
      - 'scripts/validate-job-history.mjs'
      - 'scripts/generate-seo.mjs'
      - 'data/jobs.json'
      - 'data/mailing-list.json'
      - '.github/workflows/weekly-job-alert.yml'
  schedule:
    # Avoid GitHub's busiest top-of-hour window and keep a second chance before
    # the 16:00 UTC Buttondown publish time. The sender is idempotent, so the
    # backup exits cleanly when the primary already scheduled that Monday.
    - cron: '37 14 * * 1'
    - cron: '23 15 * * 1'
  workflow_dispatch:
    inputs:
      schedule_alert:
        description: 'Schedule the next Monday alert in Buttondown'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-job-alert
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate alert feed publication safety
        run: |
          # Weekly email is an outbound publication surface. Re-check the same
          # mission-fit and official-source contracts here so a broken main feed
          # can never be turned into a scheduled email simply because another
          # workflow's check was skipped, delayed, or failed after publication.
          node scripts/validate.mjs
          node scripts/validate-priority-employer-sources.mjs
          node scripts/validate-direct-role-links.mjs
      - name: Validate weekly mailing configuration
        run: node scripts/validate-mailing-list.mjs
      - name: Validate alert signup surface parity
        run: node scripts/validate-alert-signup-parity.mjs
      - name: Validate alert job-detail routing parity
        run: node scripts/validate-alert-job-detail-parity.mjs
      - name: Validate persisted first-seen job history
        run: node scripts/validate-job-history.mjs --allow-aging
      - name: Validate employer-diverse weekly alert selection
        run: node scripts/send-weekly-job-alert.mjs --test-selection
      - name: Validate personalized weekly alert
        run: node scripts/send-weekly-job-alert.mjs --dry-run

  schedule-alert:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.schedule_alert)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schedule Monday Buttondown alert
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/send-weekly-job-alert.mjs --schedule
