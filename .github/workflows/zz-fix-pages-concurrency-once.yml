name: One-time scope Pages concurrency

on:
  push:
    branches:
      - fix/pages-deploy-concurrency-scope

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-deploy-concurrency-scope
          fetch-depth: 0
      - name: Generate patched Pages workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/pages.yml').read_text()

          source, removed = re.subn(
              r'^# Let an active Pages deployment finish\. GitHub keeps at most one pending run\n'
              r'# in this group, so rapid source refreshes coalesce to the newest revision\n'
              r'# instead of repeatedly cancelling deployment before it can complete\.\n'
              r'concurrency:\n'
              r'  group: data-center-careers\n'
              r'  cancel-in-progress: false\n\n',
              '',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if removed != 1:
              raise SystemExit(f'Expected to remove one workflow-level concurrency block, removed {removed}')

          pattern = (
              r'(  deploy:\n'
              r'    needs: \[refresh\]\n'
              r"    if: always\(\) && \(github\.event_name == 'push' \|\| \(github\.event_name == 'workflow_dispatch' && inputs\.deploy_only == true\) \|\| needs\.refresh\.result == 'success'\)\n)"
              r'(    environment:\n)'
          )
          insertion = (
              r'\1'
              '    # Serialize only actual Pages deployments. Keeping concurrency at the job\n'
              '    # level lets source-refresh workflows materialize instead of being dropped\n'
              '    # while an earlier deployment is pending at GitHub Pages.\n'
              '    concurrency:\n'
              '      group: data-center-careers-deploy\n'
              '      cancel-in-progress: false\n'
              r'\2'
          )
          source, inserted = re.subn(pattern, insertion, source, count=1)
          if inserted != 1:
              raise SystemExit(f'Expected to insert one deploy concurrency block, inserted {inserted}')
          if '\nconcurrency:\n  group: data-center-careers\n' in source:
              raise SystemExit('Workflow-level concurrency still present')
          if source.count('group: data-center-careers-deploy') != 1:
              raise SystemExit('Deploy concurrency missing or duplicated')

          Path('tmp-pages-patched.yml').write_text(source)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-pages-patched.yml
          git diff --cached --check
          git commit -m "Generate patched Pages workflow blob"
          git push origin HEAD:fix/pages-deploy-concurrency-scope
